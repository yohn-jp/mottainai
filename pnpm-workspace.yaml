# Single-package repository; this file exists only for the allowBuilds and
# minimumReleaseAgeExclude settings below. pnpm 9 requires a non-empty
# `packages` field once pnpm-workspace.yaml is present, even for a root-only
# install (observed when the Nix mottainai derivation copies this file in
# alongside the tracked source; see issue #606).
packages:
  - "."
allowBuilds:
  # The ocr CLI launcher (bin/ocr.js) execs a platform-specific binary
  # already installed via optionalDependencies; postinstall's
  # scripts/install.js only exists as a network-download fallback for
  # platforms without a matching optionalDependency package. Denied
  # deliberately to avoid running an arbitrary postinstall script from a
  # third-party package for functionality this repository doesn't need.
  '@alibaba-group/open-code-review': false
  esbuild: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
minimumReleaseAgeExclude:
  - nawabari@0.5.0 || 0.6.1
  - suzukuri@0.1.0
  - '@alibaba-group/ocr-darwin-arm64@1.11.4'
  - '@alibaba-group/ocr-darwin-x64@1.11.4'
  - '@alibaba-group/ocr-linux-arm64@1.11.4'
  - '@alibaba-group/ocr-linux-x64@1.11.4'
  - '@alibaba-group/ocr-win32-arm64@1.11.4'
  - '@alibaba-group/ocr-win32-x64@1.11.4'
  - '@alibaba-group/open-code-review@1.11.4'

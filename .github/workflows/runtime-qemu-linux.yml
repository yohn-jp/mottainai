name: Managed QEMU (Linux)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-qemu-linux.yml"
      - "scripts/runtime-qemu-contract.mjs"
      - "scripts/build-runtime-qemu-manifest.mjs"
      - "scripts/verify-runtime-qemu-artifact.mjs"
      - "scripts/runtime-qemu-boot-smoke.mjs"
      - "src/local-runtime/artifacts.ts"
      - "src/local-runtime/types.ts"
  pull_request:
    paths:
      - ".github/workflows/runtime-qemu-linux.yml"
      - "scripts/runtime-qemu-contract.mjs"
      - "scripts/build-runtime-qemu-manifest.mjs"
      - "scripts/verify-runtime-qemu-artifact.mjs"
      - "scripts/runtime-qemu-boot-smoke.mjs"
      - "src/local-runtime/artifacts.ts"
      - "src/local-runtime/types.ts"
  workflow_dispatch: {}

concurrency:
  group: runtime-qemu-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  QEMU_SOURCE_URL: https://download.qemu.org/qemu-9.2.2.tar.xz
  QEMU_SOURCE_SHA256: 752eaeeb772923a73d536b231e05bcc09c9b1f51690a41ad9973d900e4ec9fbf

jobs:
  # Each Linux architecture proves its own pinned source, dependencies, and
  # artifact/boot-smoke evidence; a build/verify failure on one matrix entry
  # never marks the other architecture available (see #311).
  build:
    name: build (${{ matrix.host }})
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-latest
            target: x86_64-softmmu
            executable: qemu-system-x86_64
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-softmmu
            executable: qemu-system-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies for manifest tooling
        run: pnpm install --frozen-lockfile

      # These are build-time toolchain/library packages, not managed QEMU
      # itself: no PATH/system QEMU package is installed, and none
      # participates in build verification or runtime smoke.
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            flex bison python3 python3-venv

      - name: Download and verify pinned QEMU source
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/qemu-source.tar.xz" "$QEMU_SOURCE_URL"
          echo "$QEMU_SOURCE_SHA256  $RUNNER_TEMP/qemu-source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qemu-src"
          tar -xJf "$RUNNER_TEMP/qemu-source.tar.xz" -C "$RUNNER_TEMP/qemu-src" --strip-components=1

      - name: Configure and build pinned QEMU (${{ matrix.target }})
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-build"
          cd "$RUNNER_TEMP/qemu-build"
          "$RUNNER_TEMP/qemu-src/configure" \
            --target-list=${{ matrix.target }} \
            --prefix=/usr/local \
            --disable-download \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc \
            --disable-spice \
            --disable-curses \
            --disable-opengl \
            --disable-virglrenderer \
            --disable-slirp \
            --disable-capstone \
            --disable-werror \
            --audio-drv-list=
          make -j"$(nproc)"
          test -x "$RUNNER_TEMP/qemu-build/${{ matrix.executable }}"

      - name: Stage runtime library dependencies from the built executable
        id: dependencies
        run: |
          set -euo pipefail
          executable="$RUNNER_TEMP/qemu-build/${{ matrix.executable }}"
          args_file="$RUNNER_TEMP/runtime-library-args"
          : > "$args_file"
          # Baseline libraries are assumed present on every target Linux host
          # (glibc/loader); everything else the build linked against is
          # bundled so the packaged artifact never depends on ambient
          # system packages.
          baseline='^(linux-vdso\.so\.1|ld-linux-x86-64\.so\.2|ld-linux-aarch64\.so\.1|libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|libresolv\.so\.2)$'
          while read -r name _ resolved _; do
            [ -z "$name" ] && continue
            if [[ "$name" =~ $baseline ]]; then continue; fi
            [ -z "$resolved" ] && continue
            [ -f "$resolved" ] || continue
            printf -- '--runtime-library\n%s=%s\n' "$name" "$resolved" >> "$args_file"
          done < <(ldd "$executable")
          {
            echo "args_file=$args_file"
          } >> "$GITHUB_OUTPUT"

      - name: Build manifest, archive, and stage the managed QEMU artifact
        id: manifest
        run: |
          set -euo pipefail
          mapfile -t library_args < "${{ steps.dependencies.outputs.args_file }}"
          output_json="$(node scripts/build-runtime-qemu-manifest.mjs \
            --host ${{ matrix.host }} \
            --executable "$RUNNER_TEMP/qemu-build/${{ matrix.executable }}" \
            --output "$RUNNER_TEMP/runtime-qemu-artifacts" \
            --workflow .github/workflows/runtime-qemu-linux.yml \
            --toolchain linux-qemu-source-build-v1 \
            --dependency-mode bundled \
            --license-file "COPYING=$RUNNER_TEMP/qemu-src/COPYING" \
            --configure-arg "--target-list=${{ matrix.target }}" \
            "${library_args[@]}")"
          echo "$output_json" > "$RUNNER_TEMP/manifest-output.json"
          staged_directory="$(echo "$output_json" | jq -r '.stagedDirectory')"
          artifact_id="$(echo "$output_json" | jq -r '.artifactId')"
          manifest_path="$(dirname "$staged_directory")/${artifact_id}.manifest.json"
          {
            echo "staged_directory=$staged_directory"
            echo "manifest_path=$manifest_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the managed QEMU artifact contract
        run: |
          node scripts/verify-runtime-qemu-artifact.mjs \
            --manifest "${{ steps.manifest.outputs.manifest_path }}" \
            --artifact-root "${{ steps.manifest.outputs.staged_directory }}"

      # Artifact-level smoke only: proves the packaged managed binary can
      # initialize. It intentionally does not claim KVM/live guest-boot
      # evidence, which #261 owns.
      - name: Run the managed QEMU boot smoke
        run: |
          node scripts/runtime-qemu-boot-smoke.mjs \
            --manifest "${{ steps.manifest.outputs.manifest_path }}" \
            --artifact-root "${{ steps.manifest.outputs.staged_directory }}"

      - name: Upload managed QEMU artifact evidence (${{ matrix.host }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-qemu-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/runtime-qemu-artifacts/${{ matrix.host }}/*.tar
            ${{ runner.temp }}/runtime-qemu-artifacts/${{ matrix.host }}/*.manifest.json
          retention-days: 14
          if-no-files-found: error

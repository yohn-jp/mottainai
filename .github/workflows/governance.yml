name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

jobs:
  standards-self-check:
    name: standards-self-check
    # The governance/actions/semantics machinery that validate-pr depends on
    # must itself be provably correct before it is trusted to gate a merge.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Governance/actions/inari self-tests
        run: pnpm run test:standards

      - name: Repository Semantics governance (observe)
        run: pnpm run semantic:validate -- --mode observe

      - name: Repository Semantics managed dogfood (enforce)
        run: pnpm run semantic:dogfood

  validate-pr:
    name: validate-pr
    needs: standards-self-check
    # Job-level filtering keeps required validate-pr checks from remaining
    # pending while excluding Dependabot and release PRs from normal governance.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base governance validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: governance
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted governance revision
        working-directory: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Collect changed files
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"

      - name: Validate branch name
        working-directory: governance
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-branch-name.mjs --branch "$HEAD_REF"

      - name: Validate PR contract
        working-directory: governance
        run: node scripts/validate-pr.mjs --event "$GITHUB_EVENT_PATH" --files "$RUNNER_TEMP/changed-files.txt" --issue-number-file "$RUNNER_TEMP/issue-number.txt" --report "$RUNNER_TEMP/governance-report.md" --regression-plan-file "$RUNNER_TEMP/regression-proof-plan.json"

      - name: Publish report-only governance observations
        if: always()
        env:
          GOVERNANCE_REPORT: ${{ runner.temp }}/governance-report.md
        run: |
          if test -f "$GOVERNANCE_REPORT"; then
            cat "$GOVERNANCE_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch linked Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER_FILE: ${{ runner.temp }}/issue-number.txt
        run: |
          issue_number="$(tr -d '\n' < "$ISSUE_NUMBER_FILE")"
          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "linked Issue number must be numeric" >&2
            exit 1
          fi
          gh issue view "$issue_number" --json body,labels > "$RUNNER_TEMP/linked-issue.json"

      - name: Validate linked Issue contract
        working-directory: governance
        run: |
          node scripts/validate-issue.mjs --body "$RUNNER_TEMP/linked-issue.json"
          if jq -e '.labels | map(.name) | any(. == "status:invalid" or . == "needs:specification")' "$RUNNER_TEMP/linked-issue.json" >/dev/null; then
            echo "linked Issue has an invalid governance label" >&2
            exit 1
          fi

name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standards-self-check:
    name: standards-self-check
    # Self-verification of the governance/actions/semantics machinery in this
    # branch's own worktree. Neither the canonical `governance` job below nor
    # `product-checks` depends on this job: `governance` trusts only
    # yohn-jp/.github's own reusable-workflow revision, and `product-checks`
    # is a PR-head-run Mottainai-internal quality gate, not an
    # organization-level authority — so this job's completion is not a
    # precondition for either.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm with frozen-lockfile install
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Governance/actions/inari self-tests
        run: pnpm run test:standards

      - name: Repository Semantics governance (observe)
        run: pnpm run semantic:validate -- --mode observe

      - name: Repository Semantics managed dogfood (enforce)
        run: pnpm run semantic:dogfood

  governance:
    name: governance
    # Ordinary, epic/<issue>-<slug>, and release/<semver> PRs all use the
    # canonical organization branch-name and PR-contract governance directly;
    # Mottainai does not locally reimplement or wrap that authority (Issue
    # #905). Only Dependabot PRs, which use their own non-conventional branch
    # naming, are excluded.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    uses: yohn-jp/.github/.github/workflows/pr-governance.yml@main
    permissions:
      contents: read

  product-checks:
    name: product-checks
    # Mottainai-specific conditional quality gates (package, compression, CLI
    # evidence) that are independent of the canonical PR-title/branch/body
    # contract enforced by the `governance` job above. Unlike that job, this
    # one is not a trusted-base gate: it is a Mottainai-internal quality
    # check, not an organization-level authority a PR could self-authorize
    # around, so it runs directly from the PR head. release/* PRs are
    # issue-less operational packaging and are exempt, matching the
    # canonical release-PR contract.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"

      - name: Validate product-specific PR checks
        run: node scripts/product-pr-checks.mjs --event "$GITHUB_EVENT_PATH" --files "$RUNNER_TEMP/changed-files.txt" --report "$RUNNER_TEMP/product-checks-report.md"

      - name: Publish product-checks observations
        if: always()
        env:
          PRODUCT_CHECKS_REPORT: ${{ runner.temp }}/product-checks-report.md
        run: |
          if test -f "$PRODUCT_CHECKS_REPORT"; then
            cat "$PRODUCT_CHECKS_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

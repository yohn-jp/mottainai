name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

jobs:
  validate-pr:
    name: validate-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base governance validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: governance
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted governance revision
        working-directory: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Collect changed files
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --no-ext-diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"

      - name: Validate branch name
        working-directory: governance
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-branch-name.mjs --branch "$HEAD_REF"

      - name: Validate PR contract
        working-directory: governance
        run: node scripts/validate-pr.mjs --event "$GITHUB_EVENT_PATH" --files "$RUNNER_TEMP/changed-files.txt" --issue-number-file "$RUNNER_TEMP/issue-number.txt" --report "$RUNNER_TEMP/governance-report.md" --regression-plan-file "$RUNNER_TEMP/regression-proof-plan.json"

      - name: Publish report-only governance observations
        if: always()
        env:
          GOVERNANCE_REPORT: ${{ runner.temp }}/governance-report.md
        run: |
          if test -f "$GOVERNANCE_REPORT"; then
            cat "$GOVERNANCE_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression-proof plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-proof-plan
          path: ${{ runner.temp }}/regression-proof-plan.json
          retention-days: 1

      - name: Fetch linked Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER_FILE: ${{ runner.temp }}/issue-number.txt
        run: |
          issue_number="$(tr -d '\n' < "$ISSUE_NUMBER_FILE")"
          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "linked Issue number must be numeric" >&2
            exit 1
          fi
          gh issue view "$issue_number" --json body,labels > "$RUNNER_TEMP/linked-issue.json"

      - name: Validate linked Issue contract
        working-directory: governance
        run: |
          node scripts/validate-issue.mjs --body "$RUNNER_TEMP/linked-issue.json"
          if jq -e '.labels | map(.name) | any(. == "status:invalid" or . == "needs:specification")' "$RUNNER_TEMP/linked-issue.json" >/dev/null; then
            echo "linked Issue has an invalid governance label" >&2
            exit 1
          fi

  # PR-authored regression-test code executes here as arbitrary code under the
  # fixed runner. This job carries no permissions and no trusted follow-up step
  # ever runs after it in this job or consumes its filesystem — its only output
  # is a report appended to its own job summary. It does not gate validate-pr,
  # and validate-pr's checkout is never shared with or reachable from this job.
  regression-proof:
    name: regression-proof
    needs: validate-pr
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base governance validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: governance
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted governance revision
        working-directory: governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Download regression-proof plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regression-proof-plan
          path: ${{ runner.temp }}/plan

      # The base validator selects only fixed argv from governance-rules.json.
      # This report-only step may use a temporary worktree, but never executes
      # a command or shell fragment copied from the PR body.
      - name: Execute eligible regression proof in isolated worktree (report-only)
        if: always()
        continue-on-error: true
        working-directory: governance
        env:
          BASE_ROOT: ${{ github.workspace }}/governance
          HEAD_ROOT: ${{ github.workspace }}/pr
        run: |
          node scripts/run-regression-proof.mjs \
            --plan-file "$RUNNER_TEMP/plan/regression-proof-plan.json" \
            --base-root "$BASE_ROOT" \
            --head-root "$HEAD_ROOT" \
            --report "$RUNNER_TEMP/regression-proof-report.md"

      - name: Publish regression-proof observation
        if: always()
        env:
          REGRESSION_REPORT: ${{ runner.temp }}/regression-proof-report.md
        run: |
          if test -f "$REGRESSION_REPORT"; then
            cat "$REGRESSION_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

name: OpenCodeReview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  eligibility:
    name: OpenCodeReview eligibility
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      base_ref: ${{ steps.check.outputs.base_ref }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Verify internal PR and trusted commenter
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              const ok = pullRequest.head.repo.full_name === repoFullName;
              core.setOutput('ok', ok);
              if (ok) {
                core.setOutput('base_ref', pullRequest.base.ref);
                core.setOutput('base_sha', pullRequest.base.sha);
                core.setOutput('head_sha', pullRequest.head.sha);
                core.setOutput('pr_number', pullRequest.number);
              }
              return;
            }

            const trustedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const comment = context.payload.comment;
            if (
              comment.body.trim() !== '/open-code-review' ||
              !trustedAssociations.includes(comment.author_association)
            ) {
              core.setOutput('ok', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const ok = pr.head.repo.full_name === repoFullName;
            core.setOutput('ok', ok);
            if (ok) {
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('pr_number', pr.number);
            }

  open-code-review:
    name: OpenCodeReview (disabled until provider bound is enforceable)
    needs: eligibility
    if: needs.eligibility.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch reviewed pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
        run: >-
          git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --no-tags origin
          "pull/${PR_NUMBER}/head"

      - name: Run bounded review preflight
        id: preflight
        env:
          REVIEWER: OpenCodeReview
          REVIEW_MODEL: ${{ vars.OPEN_CODE_REVIEW_MODEL || 'moonshotai/Kimi-K3' }}
          REVIEW_CONTEXT_TOKENS: ${{ vars.OPEN_CODE_REVIEW_CONTEXT_TOKENS || '32768' }}
          REVIEW_OUTPUT_RESERVE_TOKENS: ${{ vars.OPEN_CODE_REVIEW_OUTPUT_RESERVE_TOKENS || '8192' }}
          REVIEW_SAFETY_MARGIN_TOKENS: ${{ vars.OPEN_CODE_REVIEW_SAFETY_MARGIN_TOKENS || '2048' }}
          REVIEW_BUDGET_EXPLICIT: ${{ vars.OPEN_CODE_REVIEW_CONTEXT_TOKENS != '' && vars.OPEN_CODE_REVIEW_OUTPUT_RESERVE_TOKENS != '' && vars.OPEN_CODE_REVIEW_SAFETY_MARGIN_TOKENS != '' }}
          # The pinned action has no enforceable request-token input. Keep
          # OpenCodeReview permanently fail-closed until an upstream or
          # repository-owned bound is implemented and regression-tested.
          REVIEW_PROVIDER_REQUEST_BOUND: "false"
          REVIEW_BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ needs.eligibility.outputs.head_sha }}
          REVIEW_PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
          REVIEW_REPO_CONTEXT_MAX_LINES: "240"
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: node scripts/review-preflight.mjs

      - name: Publish non-secret review metadata
        if: always()
        env:
          PREFLIGHT_STATUS: ${{ steps.preflight.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.status }}
          REVIEW_STATUS: disabled
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          REVIEW_MODEL: ${{ vars.OPEN_CODE_REVIEW_MODEL || 'moonshotai/Kimi-K3' }}
          REVIEW_CONTEXT_TOKENS: ${{ steps.preflight.outputs.total_context_tokens }}
          REVIEW_OUTPUT_RESERVE_TOKENS: ${{ steps.preflight.outputs.reserved_output_tokens }}
          REVIEW_SAFETY_MARGIN_TOKENS: ${{ steps.preflight.outputs.safety_margin_tokens }}
          REVIEW_MAX_INPUT_TOKENS: ${{ steps.preflight.outputs.maximum_input_tokens }}
          REVIEW_INPUT_TOKENS: ${{ steps.preflight.outputs.estimated_input_tokens }}
          PROVIDER_BOUND: ${{ steps.preflight.outputs.provider_request_bound }}
          PROVIDER_ALLOWED: ${{ steps.preflight.outputs.provider_invocation_allowed }}
          CHUNKING: ${{ steps.preflight.outputs.chunking }}
          PASS_COUNT: ${{ steps.preflight.outputs.passes }}
          CHUNK_COUNT: ${{ steps.preflight.outputs.chunks }}
        run: |
          {
            echo "### OpenCodeReview"
            echo "- Harness: OpenCodeReview"
            echo "- Provider action: disabled until an enforceable request bound exists"
            echo "- Model configuration: ${REVIEW_MODEL} (not invoked)"
            echo "- Preflight: ${PREFLIGHT_RESULT:-unavailable} (step=${PREFLIGHT_STATUS:-unavailable})"
            echo "- Budget: context=${REVIEW_CONTEXT_TOKENS:-unavailable}, output-reserve=${REVIEW_OUTPUT_RESERVE_TOKENS:-unavailable}, safety-margin=${REVIEW_SAFETY_MARGIN_TOKENS:-unavailable}, effective-input=${REVIEW_MAX_INPUT_TOKENS:-unavailable}"
            echo "- Estimated input: ${REVIEW_INPUT_TOKENS:-unavailable}"
            echo "- Provider request bound proven: ${PROVIDER_BOUND:-false}"
            echo "- Credentialed provider invocation allowed: ${PROVIDER_ALLOWED:-false}"
            echo "- Chunking: ${CHUNKING:-false}"
            echo "- Passes: ${PASS_COUNT:-0}"
            echo "- Chunks: ${CHUNK_COUNT:-0}"
            echo "- Review step: ${REVIEW_STATUS:-not_started}"
            echo "- Incremental duplicate suppression: not applicable (provider disabled)"
            echo "- Severity routing: not applicable (provider disabled)"
            echo "- Raw artifacts: disabled"
            echo "- Reason: ${PREFLIGHT_REASON:-unavailable}"
            echo "- Status: review_not_generated"
          } >> "$GITHUB_STEP_SUMMARY"

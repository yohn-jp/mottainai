name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Main pushes are immutable release-of-truth events; only superseded PR
  # commits are canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-integrity:
    name: static integrity (typecheck / lint / architecture / build)
    # Keep the workflow subscribed so required checks resolve as skipped/success.
    # Only normal pull requests consume the normal PR CI jobs.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (correctness rules)
        run: pnpm run lint

      - name: Architecture/static validation
        run: pnpm run architecture:check

      - name: Build
        run: pnpm run build

  product-contract:
    name: product contract (golden path / packed artifact)
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The packed Pi issue-to-PR golden path (#334) launches Pi through a
      # real Zellij session, not a stub, so the gate cannot silently pass by
      # skipping for a missing companion. Pinned to the version that ships
      # `zellij action list-panes --json` (see src/manager/zellij.ts).
      - name: Install Zellij
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zellij.tar.gz "https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz"
          echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  /tmp/zellij.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/zellij.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/zellij
          rm /tmp/zellij.tar.gz

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required test tools
        run: |
          rg --version
          zellij --version

      # Bounded black-box coverage: task start / worktree isolation, managed
      # mutation boundaries, lifecycle/state consistency, and cleanup.
      - name: Test (managed workflow lifecycle contract)
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      # Both consumers use the same build. Running them concurrently removes
      # the old build -> e2e -> package serialization without hiding either
      # result; each log is printed and each exit status is checked.
      - name: Test built dist e2e and packed artifact package concurrently
        shell: bash
        run: |
          set -uo pipefail
          e2e_log="$RUNNER_TEMP/mottainai-e2e.log"
          package_log="$RUNNER_TEMP/mottainai-package.log"

          pnpm run test:e2e >"$e2e_log" 2>&1 &
          e2e_pid=$!
          node scripts/run-package-suite.mjs >"$package_log" 2>&1 &
          package_pid=$!

          set +e
          wait "$e2e_pid"
          e2e_status=$?
          wait "$package_pid"
          package_status=$?
          set -e

          echo "=== built dist e2e ==="
          cat "$e2e_log"
          echo "=== packed artifact package ==="
          cat "$package_log"
          test "$e2e_status" -eq 0
          test "$package_status" -eq 0

  node-compatibility-smoke:
    name: packed artifact Node compatibility smoke (Node 24)
    # engines.node declares >=22.13; this is compatibility evidence for the
    # current supported major beyond the floor, not a second full suite.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      # See the product-contract job: the packed golden path (#334) requires
      # a real Zellij, not a stub.
      - name: Install Zellij
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zellij.tar.gz "https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz"
          echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  /tmp/zellij.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/zellij.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/zellij
          rm /tmp/zellij.tar.gz

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and packed consumer / MCP compatibility smoke
        run: pnpm run test:package

  runtime-contract-changes:
    name: detect Nix/QEMU runtime-contract path changes
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter runtime-owned paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            runtime:
              - 'nix/**'
              - 'src/local-runtime/**'
              - 'src/runtime-contract/**'
              - 'scripts/build-runtime-image-manifest.mjs'
              - 'scripts/build-runtime-appliance-manifest.mjs'
              - '.github/workflows/ci.yml'

  runtime-contract:
    name: Nix Runtime evaluation / image / VM test
    needs: runtime-contract-changes
    # Path-owned: this expensive validation runs only when a changed path can
    # invalidate the Nix/QEMU runtime contract. Unrelated PRs get a
    # deterministic successful skip under the same stable check name.
    if: >-
      needs.runtime-contract-changes.outputs.runtime == 'true' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with KVM support
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          kvm: true

      - name: Setup Node.js for manifest generation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Install Node dependencies for adapter metadata validation
        run: pnpm install --frozen-lockfile

      - name: Evaluate locked flake outputs
        working-directory: nix
        run: nix flake check --no-update-lock-file --no-build --all-systems

      - name: Build canonical Runtime system, VM, and image projection
        working-directory: nix
        run: |
          set -euo pipefail
          nix build --no-update-lock-file --no-link .#runtime-system
          nix build --no-update-lock-file --no-link .#runtime-vm
          nix build --no-update-lock-file --no-link .#runtime-image

      - name: Generate and validate relocatable Runtime image metadata
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-image)"
          host_key_file="$RUNNER_TEMP/runtime-host-key"
          ssh-keygen -q -t ed25519 -N '' -f "$host_key_file"
          host_key="127.0.0.1 $(awk '{print $1, $2}' "$host_key_file.pub")"
          node ../scripts/build-runtime-image-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$image_output" \
            --host-key "$host_key" \
            --output "$RUNNER_TEMP/runtime-image" \
            --lock ./flake.lock \
            --flake nix/flake.nix
          manifest="$RUNNER_TEMP/runtime-image/x86_64-linux/runtime-image.json"
          test -s "$manifest"
          jq -e '
            .contractId == "mottainai.linux-runtime.v1" and
            .schemaVersion == 1 and
            .architecture == "x86_64-linux" and
            .kernelPath == "kernel" and
            .initrdPath == "initrd" and
            .diskPath == "runtime-disk.raw" and
            (.canonicalSource.lockSha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest"
          MANIFEST="$manifest" node --import tsx --input-type=module -e '
            import { readRuntimeImageManifest, verifyMaterializedRuntimeImage } from "../src/local-runtime/image.ts";
            const manifest = readRuntimeImageManifest(process.env.MANIFEST);
            verifyMaterializedRuntimeImage({
              kernelImage: manifest.kernelPath,
              initrdImage: manifest.initrdPath,
              diskImage: manifest.diskPath,
            }, manifest);
          '

      - name: Execute the Runtime NixOS VM test
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#checks.x86_64-linux.runtime-vm

  runtime-appliance-artifact:
    name: Publish canonical Runtime Appliance artifact
    needs: [runtime-contract-changes, runtime-contract]
    # Fails closed behind the existing #259/#568 Nix/Runtime contract checks
    # (Issue #601 acceptance criterion 3): a canonical identity/behavior
    # regression there must block artifact publication, not merely be
    # reported alongside it.
    if: >-
      needs.runtime-contract-changes.outputs.runtime == 'true' &&
      needs.runtime-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Node.js for manifest generation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Install Node dependencies for manifest verification
        run: pnpm install --frozen-lockfile

      - name: Build the canonical, self-bootable Runtime Appliance disk
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#runtime-appliance-image

      - name: Generate and verify the bounded Runtime Appliance manifest
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-appliance-image)"
          mottainai_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.mottainai.version)"
          nawabari_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.nawabari.version)"
          node ../scripts/build-runtime-appliance-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$image_output" \
            --source-revision "${{ github.sha }}" \
            --mottainai-version "$mottainai_version" \
            --nawabari-version "$nawabari_version" \
            --output "$RUNNER_TEMP/runtime-appliance"
          manifest="$RUNNER_TEMP/runtime-appliance/x86_64-linux/runtime-appliance-manifest.json"
          disk="$RUNNER_TEMP/runtime-appliance/x86_64-linux/mottainai-runtime-appliance.raw"
          test -s "$manifest"
          jq -e '
            .contractId == "mottainai.linux-runtime-appliance.v1" and
            .schemaVersion == 1 and
            .architecture == "x86_64-linux" and
            (.sourceRevision | test("^[0-9a-f]{40}$")) and
            (.nixSystemClosure | startswith("/nix/store/")) and
            .image.format == "raw" and
            (.image.sha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest"
          MANIFEST="$manifest" DISK="$disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "../src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '
          echo "RUNTIME_APPLIANCE_DIRECTORY=$RUNNER_TEMP/runtime-appliance/x86_64-linux" >> "$GITHUB_ENV"

      - name: Upload the Runtime Appliance disk and manifest as Actions artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mottainai-runtime-appliance-x86_64-linux
          path: |
            ${{ env.RUNTIME_APPLIANCE_DIRECTORY }}/mottainai-runtime-appliance.raw
            ${{ env.RUNTIME_APPLIANCE_DIRECTORY }}/runtime-appliance-manifest.json
          if-no-files-found: error
          retention-days: 14

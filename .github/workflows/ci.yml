name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # Main pushes are immutable release-of-truth events; only superseded PR
  # commits are canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript-ci:
    name: TypeScript foundation
    needs: runtime-contract-changes
    if: >-
      needs.runtime-contract-changes.outputs.node == 'true' &&
      github.event_name != 'pull_request' ||
      (
        needs.runtime-contract-changes.outputs.node == 'true' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    uses: yohn-jp/.github/.github/workflows/typescript-cli-ci.yml@main
    with:
      node-version: "24"
      conformance-script: "architecture:check"
      test-setup-command: 'sudo install -d -o "$(id -u)" -g "$(id -g)" /var/lib/mottainai-control/managed-runtime'
      # Mottainai retains its repository-owned governance workflow; #441
      # owns any future shared metadata/governance migration.
      run-governance: false
    permissions:
      contents: read

  host-bootstrap:
    name: host bootstrap (Rust)
    needs: runtime-contract-changes
    if: >-
      needs.runtime-contract-changes.outputs.host_bootstrap == 'true' &&
      github.event_name != 'pull_request' ||
      (
        needs.runtime-contract-changes.outputs.host_bootstrap == 'true' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cargo registry and target cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host-bootstrap/target
          key: ${{ runner.os }}-mottainai-cargo-${{ hashFiles('host-bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mottainai-cargo-${{ hashFiles('host-bootstrap/Cargo.lock') }}-

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install portable Linux target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Format
        run: cargo fmt --manifest-path host-bootstrap/Cargo.toml -- --check

      - name: Test
        run: cargo test --locked --manifest-path host-bootstrap/Cargo.toml

      - name: Test portable Linux target
        run: cargo test --locked --target x86_64-unknown-linux-musl --manifest-path host-bootstrap/Cargo.toml

      - name: Lint
        run: cargo clippy --locked --manifest-path host-bootstrap/Cargo.toml --all-targets -- -D warnings

      - name: Build Linux x86_64 release artifact
        working-directory: host-bootstrap
        run: |
          cargo build --locked --target x86_64-unknown-linux-musl --release
          cp target/x86_64-unknown-linux-musl/release/mottainai-init mottainai-init-linux-x86_64
          file mottainai-init-linux-x86_64 | grep -E 'static(-pie)? linked|musl'
          if readelf -d mottainai-init-linux-x86_64 | grep -q NEEDED; then
            echo 'portable artifact unexpectedly has dynamic dependencies' >&2
            exit 1
          fi
          if readelf -l mottainai-init-linux-x86_64 | grep -q INTERP; then
            echo 'portable artifact unexpectedly has a dynamic loader' >&2
            exit 1
          fi
          ./mottainai-init-linux-x86_64 --version
          sha256sum mottainai-init-linux-x86_64 > mottainai-init-linux-x86_64.sha256

      - name: Upload host bootstrap release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mottainai-init-linux-x86_64
          path: |
            host-bootstrap/mottainai-init-linux-x86_64
            host-bootstrap/mottainai-init-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 14

  static-integrity:
    name: static integrity (typecheck / lint / architecture / build)
    needs: [runtime-contract-changes, typescript-ci]
    # Keep the workflow subscribed so required checks resolve as skipped/success.
    # Only normal pull requests consume the normal PR CI jobs.
    if: >-
      always() &&
      (
      needs.runtime-contract-changes.outputs.node == 'true' &&
      github.event_name != 'pull_request' ||
      (
        needs.runtime-contract-changes.outputs.node == 'true' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify shared TypeScript foundation
        env:
          FOUNDATION_RESULT: ${{ needs.typescript-ci.result }}
        run: |
          set -euo pipefail
          echo "typescript foundation: $FOUNDATION_RESULT"
          if [ "$FOUNDATION_RESULT" != "success" ]; then
            echo "::error::shared TypeScript foundation did not succeed (result: $FOUNDATION_RESULT)" >&2
            exit 1
          fi

  test-integration:
    name: test:integration (shard ${{ matrix.shard }}/4)
    needs: runtime-contract-changes
    if: >-
      needs.runtime-contract-changes.outputs.integration == 'true' &&
      github.event_name != 'pull_request' ||
      (
        needs.runtime-contract-changes.outputs.integration == 'true' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The packed Pi issue-to-PR golden path (#334) launches Pi through a
      # real Zellij session, not a stub, so the gate cannot silently pass by
      # skipping for a missing companion. Pinned to the version that ships
      # `zellij action list-panes --json` (see src/manager/zellij.ts).
      - name: Install Zellij
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zellij.tar.gz "https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz"
          echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  /tmp/zellij.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/zellij.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/zellij
          rm /tmp/zellij.tar.gz

      - name: Setup Node.js and pnpm with frozen-lockfile install
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Verify required test tools
        run: |
          rg --version
          zellij --version

      # Bounded black-box coverage: task start / worktree isolation, managed
      # mutation boundaries, lifecycle/state consistency, and cleanup. The
      # repository-controlled timing table assigns files to a deterministic
      # duration-aware 4-way layout; every file remains covered exactly once.
      - name: Test (managed workflow lifecycle contract, shard ${{ matrix.shard }}/4)
        run: pnpm run test:integration -- --shard=${{ matrix.shard }}/4

  build-and-package-e2e:
    name: build / packed artifact e2e / package
    needs: runtime-contract-changes
    if: >-
      needs.runtime-contract-changes.outputs.package == 'true' &&
      github.event_name != 'pull_request' ||
      (
        needs.runtime-contract-changes.outputs.package == 'true' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The packed Pi issue-to-PR golden path (#334) launches Pi through a
      # real Zellij session, not a stub, so the gate cannot silently pass by
      # skipping for a missing companion. Pinned to the version that ships
      # `zellij action list-panes --json` (see src/manager/zellij.ts).
      - name: Install Zellij
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zellij.tar.gz "https://github.com/zellij-org/zellij/releases/download/v0.44.3/zellij-x86_64-unknown-linux-musl.tar.gz"
          echo "0f7c346788627f506c0a28296517768633cff24fc822a739f8264b640ecad751  /tmp/zellij.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/zellij.tar.gz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/zellij
          rm /tmp/zellij.tar.gz

      - name: Setup Node.js and pnpm with frozen-lockfile install
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Verify required test tools
        run: |
          rg --version
          zellij --version

      - name: Build
        run: pnpm run build

      # Both consumers use the same build. Running them concurrently removes
      # the old build -> e2e -> package serialization without hiding either
      # result; each log is printed and each exit status is checked. This job
      # does not wait on test-integration: both consume the same build/checkout
      # independently, and the golden-path e2e/package suites do not depend on
      # the integration suite's outcome.
      - name: Test built dist e2e and packed artifact package concurrently
        shell: bash
        run: |
          set -uo pipefail
          e2e_log="$RUNNER_TEMP/mottainai-e2e.log"
          package_log="$RUNNER_TEMP/mottainai-package.log"

          pnpm run test:e2e >"$e2e_log" 2>&1 &
          e2e_pid=$!
          node scripts/run-package-suite.mjs >"$package_log" 2>&1 &
          package_pid=$!

          set +e
          wait "$e2e_pid"
          e2e_status=$?
          wait "$package_pid"
          package_status=$?
          set -e

          echo "=== built dist e2e ==="
          cat "$e2e_log"
          echo "=== packed artifact package ==="
          cat "$package_log"
          test "$e2e_status" -eq 0
          test "$package_status" -eq 0

  runtime-contract-changes:
    name: detect CI ownership path changes
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    outputs:
      runtime_nix: ${{ steps.filter.outputs.runtime_nix }}
      runtime_vm: ${{ steps.filter.outputs.runtime_vm }}
      runtime_appliance: ${{ steps.filter.outputs.runtime_appliance }}
      host_bootstrap: ${{ steps.filter.outputs.host_bootstrap }}
      node: ${{ steps.filter.outputs.node }}
      integration: ${{ steps.filter.outputs.integration }}
      package: ${{ steps.filter.outputs.package }}
      governance: ${{ steps.filter.outputs.governance }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Contract-ownership classes, not directory buckets (docs/ci-topology.md).
      # `host-bootstrap/**` alone must never imply the Nix Runtime/VM/Appliance
      # classes (Issue #766) - only files that truly define or consume a
      # shared Runtime/VM/Appliance contract get overlapping ownership, and
      # workflow/config inputs that can change selection semantics stay in
      # every class conservatively.
      - name: Filter contract-owned paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            host_bootstrap:
              - 'host-bootstrap/**'
              # Shared Appliance manifest contract: the TypeScript side is a
              # true co-owner, not just a runtime_appliance consumer, so a
              # schema change here must also gate the Rust consumer tests
              # (host-bootstrap/tests/appliance_real.rs) that verify against it.
              - 'src/runtime-contract/appliance-manifest.ts'
              - 'src/runtime-contract/appliance-manifest.test.ts'
              - '.github/workflows/ci.yml'
            runtime_nix:
              - 'nix/**'
              - 'src/bootstrap/**'
              - 'src/runtime-contract/**'
              - 'src/atomic-file.ts'
              - 'src/boundary.ts'
              - 'scripts/route2-runtime-smoke.mjs'
              - 'scripts/build-runtime-image-manifest.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            runtime_vm:
              - 'nix/modules/runtime.nix'
              - 'nix/runtime-image.nix'
              - 'nix/tests/runtime.nix'
              - '.github/workflows/ci.yml'
            runtime_appliance:
              - 'nix/runtime-appliance-image.nix'
              - 'nix/tests/runtime-appliance.nix'
              - 'nix/tests/runtime-appliance-golden-path.nix'
              - 'scripts/build-runtime-appliance-manifest.mjs'
              - 'scripts/build-runtime-appliance-oci-fixture.mjs'
              - 'src/runtime-contract/appliance-manifest.ts'
              - 'src/runtime-contract/appliance-manifest.test.ts'
              - 'host-bootstrap/src/appliance.rs'
              - 'host-bootstrap/src/oci.rs'
              - 'host-bootstrap/tests/appliance.rs'
              - 'host-bootstrap/tests/appliance_real.rs'
              - '.github/workflows/ci.yml'
            node:
              - 'src/**'
              - 'scripts/architecture-check.mjs'
              - 'scripts/copy-dashboard-assets.mjs'
              - 'scripts/generate-build-metadata.mjs'
              - 'scripts/**/*.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.build.json'
              - 'eslint.config.mjs'
              - 'prettier.config.mjs'
              - '.github/workflows/ci.yml'
            integration:
              - 'src/**'
              - 'scripts/lib/**'
              - 'scripts/fixtures/**'
              - 'scripts/run-test-suite.mjs'
              - 'scripts/test-suites.mjs'
              - 'scripts/test-suites.test.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            package:
              - 'src/**'
              - 'scripts/smoke-test.mjs'
              - 'scripts/run-package-suite.mjs'
              - 'scripts/mcp-stdio-package.test.mjs'
              - 'scripts/packed-workflow-e2e.test.mjs'
              - 'scripts/gh-inari-package-smoke.mjs'
              - 'scripts/lib/mcp-blackbox-*.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            governance:
              - '.github/inari/**'
              - '.github/workflows/governance.yml'
              - 'scripts/governance-*.mjs'
              - 'scripts/validate-*.mjs'
              - 'scripts/semantic-governance.ts'
              - 'scripts/coverage-policy.json'

  runtime-nix:
    name: "Nix Runtime: evaluation / managed packages / Route 2"
    needs: runtime-contract-changes
    # Path-owned (docs/ci-topology.md `runtime-nix`): proves the Nix Runtime
    # system closure, managed generation, and Route 2 package catalog. VM and
    # Appliance changes also select this job because they consume its build
    # as a prerequisite (docs/ci-topology.md dependency edges), but a Nix
    # Runtime-only change never pulls in the VM or Appliance jobs below. On
    # trusted `main` pushes only, a `host_bootstrap` change also selects this
    # job: trusted `main` owns the cross-boundary composition proof between
    # standalone `mottainai-init` and the real canonical Appliance (Issue
    # #768), which needs the Nix prerequisite even when no Runtime/VM/
    # Appliance path itself changed. A host-bootstrap-only PR must not pull
    # this in (docs/ci-topology.md PR validation matrix).
    if: >-
      (
        needs.runtime-contract-changes.outputs.runtime_nix == 'true' ||
        needs.runtime-contract-changes.outputs.runtime_vm == 'true' ||
        needs.runtime-contract-changes.outputs.runtime_appliance == 'true' ||
        (
          github.event_name != 'pull_request' &&
          needs.runtime-contract-changes.outputs.host_bootstrap == 'true'
        )
      ) &&
      (
        github.event_name != 'pull_request' ||
        (
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Node.js and pnpm with frozen-lockfile install for managed-generation verification scripts
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Verify corrected production deployment artifact round-trip (Issue #832)
        run: pnpm run test:deployment-roundtrip

      - name: Evaluate locked flake outputs
        working-directory: nix
        run: nix flake check --no-update-lock-file --no-build --all-systems

      - name: Build the canonical Runtime system closure
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#runtime-system

      - name: Verify managed generation build is independent of caller cwd (Issue #643 regression)
        run: node --import tsx scripts/verify-managed-generation-cwd-independence.mjs x86_64-linux

      # Issue #662: build and smoke-verify every entry in the first
      # supported managed Runtime package catalog (each package's own
      # installCheckPhase/check derivation runs as part of its build).
      - name: Build and smoke-verify the managed Runtime package catalog (Issue #662)
        working-directory: nix
        run: |
          set -euo pipefail
          nix build --no-update-lock-file --no-link .#mottainai .#nawabari .#zellij
          nix build --no-update-lock-file --no-link .#checks.x86_64-linux.zellij

      # `nix flake check --no-build` above only evaluates checks; it never
      # builds/runs them, so the real-projection catalog test
      # (nix/tests/managed-generation.nix) needs its own explicit build step,
      # the same way "Execute the managed-runtime health projection check"
      # below already does for that non-VM check.
      - name: Execute the managed generation projection check (Issue #625/#662)
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#checks.x86_64-linux.managed-generation

      - name: Build the full managed Runtime package catalog end to end (Issue #662)
        run: node --import tsx scripts/verify-managed-generation-catalog.mjs x86_64-linux

      - name: Execute hermetic Route 2 closure and functional readiness smoke (Issue #752)
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#checks.x86_64-linux.route2-runtime-closure

      - name: Execute the managed-runtime health projection check (Issue #644)
        working-directory: nix
        # `nix flake check --no-build` above only evaluates checks; it
        # never builds/runs them, so this non-VM check needs its own
        # explicit build step (review response on PR #647) the same way
        # "Execute the Runtime NixOS VM test" below already does for the
        # VM check.
        run: nix build --no-update-lock-file --no-link .#checks.x86_64-linux.managed-runtime-health

  runtime-vm:
    name: "Runtime VM: guest boot"
    needs: [runtime-contract-changes, runtime-nix]
    # Path-owned (docs/ci-topology.md `runtime-vm`): only a change that can
    # invalidate NixOS guest boot/runtime semantics pays for the VM
    # derivation build and bounded VM boot test. Requires the Nix Runtime
    # prerequisite (runtime-nix) to have actually succeeded first.
    if: >-
      needs.runtime-nix.result == 'success' &&
      needs.runtime-contract-changes.outputs.runtime_vm == 'true' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with KVM support
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          kvm: true

      - name: Setup Node.js and pnpm with frozen-lockfile install for manifest generation
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Build the Runtime VM and relocatable image projection
        working-directory: nix
        run: |
          set -uo pipefail
          nix build --no-update-lock-file --no-link .#runtime-vm >"$RUNNER_TEMP/runtime-vm.log" 2>&1 &
          vm_pid=$!
          nix build --no-update-lock-file --no-link .#runtime-image >"$RUNNER_TEMP/runtime-image.log" 2>&1 &
          image_pid=$!

          set +e
          wait "$vm_pid"
          vm_status=$?
          wait "$image_pid"
          image_status=$?
          set -e

          echo "=== runtime-vm ==="
          cat "$RUNNER_TEMP/runtime-vm.log"
          echo "=== runtime-image ==="
          cat "$RUNNER_TEMP/runtime-image.log"
          test "$vm_status" -eq 0
          test "$image_status" -eq 0

      - name: Generate and validate relocatable Runtime image metadata
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-image)"
          host_key_file="$RUNNER_TEMP/runtime-host-key"
          ssh-keygen -q -t ed25519 -N '' -f "$host_key_file"
          host_key="127.0.0.1 $(awk '{print $1, $2}' "$host_key_file.pub")"
          node ../scripts/build-runtime-image-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$image_output" \
            --host-key "$host_key" \
            --output "$RUNNER_TEMP/runtime-image" \
            --lock ./flake.lock \
            --flake nix/flake.nix
          manifest="$RUNNER_TEMP/runtime-image/x86_64-linux/runtime-image.json"
          test -s "$manifest"
          jq -e '
            .contractId == "mottainai.linux-runtime.v1" and
            .schemaVersion == 1 and
            .architecture == "x86_64-linux" and
            .kernelPath == "kernel" and
            .initrdPath == "initrd" and
            .diskPath == "runtime-disk.raw" and
            (.kernelSha256 | test("^[0-9a-f]{64}$")) and
            (.initrdSha256 | test("^[0-9a-f]{64}$")) and
            (.diskSha256 | test("^[0-9a-f]{64}$")) and
            (.canonicalSource.lockSha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest"
          manifest_directory="$(dirname "$manifest")"
          for asset in kernel initrd disk; do
            relative_path="$(jq -r ".${asset}Path" "$manifest")"
            expected_hash="$(jq -r ".${asset}Sha256" "$manifest")"
            actual_hash="$(sha256sum "$manifest_directory/$relative_path" | awk '{print $1}')"
            test "$actual_hash" = "$expected_hash"
          done

      - name: Execute the Runtime NixOS VM test
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#checks.x86_64-linux.runtime-vm

  runtime-appliance:
    name: "Runtime Appliance: canonical image / bounded manifest"
    needs: [runtime-contract-changes, runtime-nix]
    # Path-owned (docs/ci-topology.md `runtime-appliance` / "Appliance proof
    # boundary"): an Appliance-defining PR must prove the canonical Appliance
    # derivation builds and its bounded manifest matches, before merge - that
    # is the full extent of PR-tier proof (Issue #768). The full
    # real-canonical-Appliance OCI-shaped composition, standalone
    # `mottainai-init` composition verification, and Runtime Appliance golden
    # path are cross-boundary integration evidence, not rejection evidence;
    # they run only on trusted `main` pushes that affect Runtime/VM/
    # Appliance/bootstrap integration, regardless of which contract class
    # invalidated it (docs/ci-topology.md "Trusted main canonical
    # integration"), and gate canonical artifact publication below.
    if: >-
      needs.runtime-nix.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        needs.runtime-contract-changes.outputs.runtime_appliance == 'true'
      ) &&
      (
        github.event_name != 'pull_request' ||
        (
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cargo registry and target cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host-bootstrap/target
          key: ${{ runner.os }}-mottainai-cargo-${{ hashFiles('host-bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mottainai-cargo-${{ hashFiles('host-bootstrap/Cargo.lock') }}-

      - name: Install Nix with KVM support
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          kvm: true

      - name: Setup Node.js and pnpm with frozen-lockfile install for manifest generation
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      # Both an Appliance-defining PR and a trusted `main` integration run
      # validate the exact publishable appliance on this existing Nix
      # runner/store, but neither persists the generated files - publication
      # rebuilds independently below, only after this certification succeeds.
      - name: Build the canonical, self-bootable Runtime Appliance disk
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#runtime-appliance-image

      - name: Generate and verify the bounded Runtime Appliance manifest
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-appliance-image)"
          mottainai_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.mottainai.version)"
          nawabari_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.nawabari.version)"
          node ../scripts/build-runtime-appliance-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$image_output" \
            --source-revision "${{ github.sha }}" \
            --mottainai-version "$mottainai_version" \
            --nawabari-version "$nawabari_version" \
            --output "$RUNNER_TEMP/runtime-appliance"
          manifest="$RUNNER_TEMP/runtime-appliance/x86_64-linux/runtime-appliance-manifest.json"
          disk="$RUNNER_TEMP/runtime-appliance/x86_64-linux/mottainai-runtime-appliance.raw"
          test -s "$manifest"
          jq -e '
            .contractId == "mottainai.linux-runtime-appliance.v1" and
            .schemaVersion == 1 and
            .architecture == "x86_64-linux" and
            (.sourceRevision | test("^[0-9a-f]{40}$")) and
            (.nixSystemClosure | startswith("/nix/store/")) and
            .image.format == "raw" and
            (.image.sha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest"
          MANIFEST="$manifest" DISK="$disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "../src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '

      # Cross-boundary integration evidence (docs/ci-topology.md "Trusted
      # main canonical integration"): the OCI-shaped composition, standalone
      # `mottainai-init` composition verification, and Runtime Appliance
      # golden path run only on trusted `main` pushes, not on the PR (Issue
      # #768). The Appliance-defining PR proof above (build + bounded
      # manifest) is unchanged and unweakened.
      - name: Install Rust toolchain for the host-bootstrap Appliance composition proof
        if: github.event_name != 'pull_request'
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build a local OCI-shaped fixture from the real canonical Runtime Appliance (Issue #661)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          node scripts/build-runtime-appliance-oci-fixture.mjs \
            --manifest "$RUNNER_TEMP/runtime-appliance/x86_64-linux/runtime-appliance-manifest.json" \
            --disk "$RUNNER_TEMP/runtime-appliance/x86_64-linux/mottainai-runtime-appliance.raw" \
            --output "$RUNNER_TEMP/runtime-appliance-oci-fixture"

      - name: Prove mottainai-init resolves/verifies the real canonical Runtime Appliance and run the Runtime Appliance golden path (Issue #630, #661, #768)
        if: github.event_name != 'pull_request'
        env:
          MOTTAINAI_REAL_APPLIANCE_OCI_MANIFEST: ${{ runner.temp }}/runtime-appliance-oci-fixture/oci-manifest.json
          MOTTAINAI_REAL_APPLIANCE_BLOBS_DIR: ${{ runner.temp }}/runtime-appliance-oci-fixture/blobs
          MOTTAINAI_REAL_APPLIANCE_RAW_DISK: ${{ runner.temp }}/runtime-appliance/x86_64-linux/mottainai-runtime-appliance.raw
          MOTTAINAI_APPLIANCE_TIMING: "1"
        run: |
          set -euo pipefail
          golden_log="$RUNNER_TEMP/runtime-appliance-golden-path.log"
          (
            set -euo pipefail
            sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
            cd nix
            # The guest intentionally exercises the production HTTPS source
            # resolver, so this one derivation runs outside the default Nix
            # sandbox; every other Runtime build in this workflow stays
            # sandboxed.
            sudo "$(command -v nix)" build --option sandbox relaxed --no-update-lock-file --no-link .#checks.x86_64-linux.runtime-appliance-golden-path
          ) >"$golden_log" 2>&1 &
          golden_pid=$!

          set +e
          cargo test --locked --manifest-path host-bootstrap/Cargo.toml \
            --test appliance_real -- --ignored --test-threads=1 --nocapture
          real_status=$?
          wait "$golden_pid"
          golden_status=$?
          set -e

          echo "=== Runtime Appliance golden path ==="
          cat "$golden_log"
          test "$real_status" -eq 0
          test "$golden_status" -eq 0

  runtime-contract:
    name: Nix Runtime evaluation / image / VM test
    needs: [runtime-contract-changes, runtime-nix, runtime-vm, runtime-appliance]
    # Stable aggregate merge gate (docs/ci-topology.md "Required-check
    # semantics"): branch protection keeps requiring this exact check name
    # even though the Nix/VM/Appliance proofs are now decomposed into
    # independently skippable jobs with per-contract failure attribution.
    # This job always runs so the check never disappears or stays pending,
    # and it fails only when a contract that was actually selected did not
    # succeed; an unselected (skipped) contract resolves deterministically.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate targeted Runtime contract results
        run: |
          set -euo pipefail
          status=0
          for entry in \
            "runtime-nix:${{ needs.runtime-nix.result }}" \
            "runtime-vm:${{ needs.runtime-vm.result }}" \
            "runtime-appliance:${{ needs.runtime-appliance.result }}"
          do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name contract did not succeed (result: $result)"
                status=1
                ;;
            esac
          done
          exit "$status"

  runtime-appliance-artifact:
    name: Publish canonical Runtime Appliance artifact
    needs: [runtime-contract-changes, runtime-contract]
    # Persist only the validated artifact from the trusted canonical `main`
    # push, and only after `runtime-contract` (which now includes the full
    # cross-boundary OCI/mottainai-init/golden-path certification on `main`,
    # not just the PR-tier build/manifest proof) has succeeded (Issue #768).
    # This publication job is intentionally skipped for pull_request events.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.runtime-contract-changes.outputs.runtime_nix == 'true' ||
        needs.runtime-contract-changes.outputs.runtime_vm == 'true' ||
        needs.runtime-contract-changes.outputs.runtime_appliance == 'true'
      ) &&
      needs.runtime-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Setup Node.js and pnpm with frozen-lockfile install for manifest generation
        uses: yohn-jp/.github/.github/actions/setup-node-pnpm@main
        with:
          node-version: "24"

      - name: Build the canonical, self-bootable Runtime Appliance disk
        working-directory: nix
        run: nix build --no-update-lock-file --no-link .#runtime-appliance-image

      - name: Generate and verify the bounded Runtime Appliance manifest
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-appliance-image)"
          mottainai_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.mottainai.version)"
          nawabari_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.nawabari.version)"
          node ../scripts/build-runtime-appliance-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$image_output" \
            --source-revision "${{ github.sha }}" \
            --mottainai-version "$mottainai_version" \
            --nawabari-version "$nawabari_version" \
            --output "$RUNNER_TEMP/runtime-appliance"
          manifest="$RUNNER_TEMP/runtime-appliance/x86_64-linux/runtime-appliance-manifest.json"
          disk="$RUNNER_TEMP/runtime-appliance/x86_64-linux/mottainai-runtime-appliance.raw"
          test -s "$manifest"
          jq -e '
            .contractId == "mottainai.linux-runtime-appliance.v1" and
            .schemaVersion == 1 and
            .architecture == "x86_64-linux" and
            (.sourceRevision | test("^[0-9a-f]{40}$")) and
            (.nixSystemClosure | startswith("/nix/store/")) and
            .image.format == "raw" and
            (.image.sha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest"
          MANIFEST="$manifest" DISK="$disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "../src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '
          echo "RUNTIME_APPLIANCE_DIRECTORY=$RUNNER_TEMP/runtime-appliance/x86_64-linux" >> "$GITHUB_ENV"

      - name: Upload the Runtime Appliance disk and manifest as Actions artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mottainai-runtime-appliance-x86_64-linux
          path: |
            ${{ env.RUNTIME_APPLIANCE_DIRECTORY }}/mottainai-runtime-appliance.raw
            ${{ env.RUNTIME_APPLIANCE_DIRECTORY }}/runtime-appliance-manifest.json
          if-no-files-found: error
          retention-days: 14

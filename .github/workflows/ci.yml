name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canonical-full:
    # Existing required check context; this job is the Ubuntu + Node 22 canonical full role.
    name: install / typecheck / test / build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (fast unit / contract)
        run: pnpm test

      - name: Test (integration / process)
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build

      - name: Test (built dist e2e / black-box)
        run: pnpm run test:e2e

      - name: Test (packed artifact package / consumer)
        run: pnpm run test:package

  standards:
    name: format / lint / architecture (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Standards self-tests (architecture / governance / test policy)
        run: pnpm run test:standards

      - name: Test classification
        run: pnpm run test:classification

      - name: Architecture/static validation
        run: pnpm run architecture:check

  coverage:
    # Existing required check context; coverage remains canonical Node 22 validation.
    name: coverage (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage (line / function / branch)
        run: pnpm run test:coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage
          if-no-files-found: error

  node-compatibility-smoke:
    name: Node compatibility smoke (Ubuntu, Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Node 24 は full suite を再実行せず、build + packed consumer/MCP path を確認する。
      - name: Build and packed consumer / MCP compatibility smoke
        run: pnpm run test:package

  windows-compatibility-smoke:
    name: Windows compatibility smoke (Windows, Node 22)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package suite は spaces を含む package path、packaged launch、initialize/list/call、EOF を検証する。
      # POSIX の SIGINT/SIGTERM lifecycle suite は Windows smoke に含めない。
      - name: Build and packed Windows consumer / MCP compatibility smoke
        run: pnpm run test:package

      # taskkill hang時も child.kill fallbackへ到達する bounded cleanup 契約をWindows実環境で確認する。
      - name: Windows bounded cleanup contract
        run: node --test --test-name-pattern "Windows forced cleanup falls back when taskkill remains hung" scripts/lib/mcp-blackbox-client.test.mjs

      # init.test.ts 全体は実行せず、Windows 固有の PATHEXT/executable discovery 契約だけ統合する。
      - name: Windows executable discovery contract
        run: node --import tsx --test --test-name-pattern "init discovers Windows executables through fixed and PATHEXT extensions" src/init.test.ts

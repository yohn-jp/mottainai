name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]

# Serialize the entire release lifecycle. Two overlapping runs would race
# each other creating the same tag/draft release, or double-publish to
# npm/GHCR/the release's assets. cancel-in-progress stays false: a
# publication in progress must run to completion (or fail on its own
# terms), never be torn down mid-publish by a later push.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare draft release
    # #726: GitHub Release immutability is enforced only after a release is
    # published; draft releases and their assets remain freely mutable. The
    # previous release: types: [published] trigger guaranteed every asset
    # upload in this workflow raced an already-immutable release and failed
    # (mottainai-init's HTTP 422 on every real run). Merging a release/<semver>
    # PR to main (governance.yml's existing release-PR contract) is the only
    # thing that changes package.json's version, so that version change is
    # now the sole trigger for the whole release lifecycle: this job creates
    # the tag and a draft release before any asset exists, and
    # finalize-release below is the only place that ever flips it to
    # published, once every asset-producing job has succeeded.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the idempotency check below may need to resolve a
          # pre-existing draft's targetCommitish, which can be an older
          # commit than a shallow fetch would include.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether package.json's version actually changed
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            previous_version="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "")"
          else
            previous_version=""
          fi
          if [ "$current_version" = "$previous_version" ]; then
            echo "package.json version unchanged ($current_version); nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not a bare MAJOR.MINOR.PATCH: $current_version" >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"

      - name: Create or resume the git tag and draft release
        # Idempotent by design: a run that fails after this step (e.g. in
        # build/publish/runtime-appliance/host-bootstrap-init) must be
        # resumable by re-running the workflow rather than requiring manual
        # cleanup. If the tag/release already exist, reuse them only when
        # their identity matches this exact run (same commit, still a
        # draft); any mismatch fails closed instead of silently adopting a
        # different release.
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
          VERSION: ${{ steps.detect.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          existing="$(gh release view "$TAG" --json isDraft,targetCommitish 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            existing_is_draft="$(jq -r '.isDraft' <<<"$existing")"
            existing_target="$(jq -r '.targetCommitish' <<<"$existing")"
            if [ "$existing_is_draft" != "true" ]; then
              echo "release $TAG already exists and is not a draft; refusing to reuse or recreate it" >&2
              exit 1
            fi
            resolved_target="$(git rev-parse --verify "${existing_target}^{commit}")"
            if [ "$resolved_target" != "$TARGET_SHA" ]; then
              echo "release $TAG already exists as a draft but targets $resolved_target, not this run's $TARGET_SHA; refusing to reuse a different commit's draft" >&2
              exit 1
            fi
            echo "draft release $TAG already exists for this exact commit; reusing it"
            exit 0
          fi

          notes_file="docs/releases/$VERSION.md"
          if [ -f "$notes_file" ]; then
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "Mottainai $VERSION" \
              --notes-file "$notes_file" \
              --draft
          else
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "Mottainai $VERSION" \
              --generate-notes \
              --draft
          fi

  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Provision the canonical control-state root for host-bootstrap tests
        # src/bootstrap/cli.test.ts exercises the real canonical
        # /var/lib/mottainai-control path (Issue #628/#644 contract) rather
        # than an injected override. The runner user needs write access to
        # that exact path for those tests to reach their assertions.
        run: |
          sudo mkdir -p /var/lib/mottainai-control
          sudo chown "$(id -u):$(id -g)" /var/lib/mottainai-control

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $tag_version"
            exit 1
          fi

      - name: Pack canonical Route 1 payload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mottainai-canonical-payload"
          node scripts/pack-canonical-payload.mjs \
            --output-dir "$RUNNER_TEMP/mottainai-canonical-payload" \
            > /dev/null
          payload="$(find "$RUNNER_TEMP/mottainai-canonical-payload" -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          identity="$payload.identity.json"
          node scripts/verify-canonical-payload.mjs --tarball "$payload" --identity "$identity"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mottainai-tarball
          path: ${{ runner.temp }}/mottainai-canonical-payload/*
          retention-days: 1

  smoke-test:
    needs: [prepare-release, build]
    name: packed package smoke test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mottainai-tarball

      - name: Verify canonical payload identity
        run: |
          set -euo pipefail
          payload="$(find . -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          node scripts/verify-canonical-payload.mjs \
            --tarball "$payload" \
            --identity "$payload.identity.json"

      - name: Smoke test packed tarball
        run: node scripts/smoke-test.mjs --tarball "$(find . -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
        shell: bash

  publish:
    needs: [prepare-release, smoke-test]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Require an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mottainai-tarball

      - name: Verify canonical payload identity before publication
        run: |
          set -euo pipefail
          payload="$(find . -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          node scripts/verify-canonical-payload.mjs \
            --tarball "$payload" \
            --identity "$payload.identity.json"

      - name: Check whether version is already published
        id: registry
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "mottainai@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: |
          set -o pipefail
          npm publish "$(find . -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)" 2>&1 | tee publish.log
          if grep -q "npm warn publish" publish.log; then
            echo "npm emitted a publish warning; treating as failure"
            exit 1
          fi

  runtime-appliance:
    name: Publish canonical Runtime Appliance OCI Artifact
    # The appliance is a separate release surface from npm. It consumes the
    # release-local canonical payload artifact and therefore can finish before
    # public npm publication; registry ordering must not be a Route 2 input.
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The release itself is immutable source/release-note metadata once
    # published. Runtime Appliance bytes are published to GHCR as a separate
    # artifact lifecycle. Keep this job's token scoped to the registry write
    # and tagged-source read it actually needs; it must not mutate a GitHub
    # Release.
    permissions:
      contents: read
      packages: write
    outputs:
      oci_digest: ${{ steps.publish_oci.outputs.digest }}
      oci_ref: ${{ steps.publish_oci.outputs.ref }}
      raw_sha256: ${{ steps.publish_oci.outputs.raw_sha256 }}
      raw_size_bytes: ${{ steps.publish_oci.outputs.raw_size_bytes }}
      manifest_sha256: ${{ steps.publish_oci.outputs.manifest_sha256 }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for release identity and manifest verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Verify exact tagged release revision and package identity
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse --verify HEAD)"
          test "$checked_out_commit" = "$tag_commit"

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $tag_version"
            exit 1
          fi

          echo "RUNTIME_APPLIANCE_SOURCE_REVISION=$tag_commit" >> "$GITHUB_ENV"
          echo "RUNTIME_APPLIANCE_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Download canonical Route 1 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mottainai-tarball
          path: ${{ runner.temp }}/mottainai-canonical-payload

      - name: Install Node dependencies for manifest verification
        run: pnpm install --frozen-lockfile

      - name: Build Route 2 package from the exact Route 1 payload
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          payload="$(find "$RUNNER_TEMP/mottainai-canonical-payload" -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          identity="$payload.identity.json"
          node scripts/verify-canonical-payload.mjs --tarball "$payload" --identity "$identity"
          payload_sha256="$(jq -er '.payload.sha256' "$identity")"
          test "$payload_sha256" = "$(sha256sum "$payload" | awk '{print $1}')"
          package_output="$(nix build --impure --no-update-lock-file --no-link --print-out-paths --expr "
            let
              flake = builtins.getFlake (toString (/. + \"$GITHUB_WORKSPACE/nix\"));
              source = /. + \"$GITHUB_WORKSPACE\";
              payload = /. + \"$payload\";
            in flake.lib.mkMottainaiFromPayload {
              system = \"x86_64-linux\";
              inherit source payload;
              payloadSha256 = \"$payload_sha256\";
            }
          ")"
          identity_output="$package_output/share/mottainai/canonical-payload.json"
          jq -e \
            --arg version "$(node -p "require('./package.json').version")" \
            --arg sha256 "$payload_sha256" \
            '.contractId == "mottainai.canonical-application-payload.v1" and .schemaVersion == 1 and .packageName == "mottainai" and .packageVersion == $version and .sha256 == $sha256' \
            "$identity_output"
          echo "Route 2 consumed canonical Route 1 payload $payload_sha256 for $RELEASE_TAG"

      - name: Prove Route 2 rejects a changed payload
        shell: bash
        run: |
          set -euo pipefail
          payload="$(find "$RUNNER_TEMP/mottainai-canonical-payload" -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          changed_payload="$RUNNER_TEMP/mottainai-canonical-payload/changed-payload.tgz"
          cp "$payload" "$changed_payload"
          node - "$changed_payload" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const bytes = fs.readFileSync(file);
          bytes[bytes.length - 1] ^= 1;
          fs.writeFileSync(file, bytes);
          NODE
          payload_sha256="$(jq -er '.payload.sha256' "$payload.identity.json")"
          if nix build --impure --no-update-lock-file --no-link --expr "
            let
              flake = builtins.getFlake (toString (/. + \"$GITHUB_WORKSPACE/nix\"));
              source = /. + \"$GITHUB_WORKSPACE\";
              payload = /. + \"$changed_payload\";
            in flake.lib.mkMottainaiFromPayload {
              system = \"x86_64-linux\";
              inherit source payload;
              payloadSha256 = \"$payload_sha256\";
            }
          " >/tmp/mottainai-route2-tamper.log 2>&1; then
            echo 'changed Route 1 payload unexpectedly passed Route 2 verification' >&2
            cat /tmp/mottainai-route2-tamper.log >&2
            exit 1
          fi
          grep -q 'canonical Route 1 payload sha256 mismatch' /tmp/mottainai-route2-tamper.log

      - name: Build canonical Runtime Appliance from the tagged source
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --no-update-lock-file --no-build --all-systems
          # #627's final contract: managed application inputs must not enter
          # the published bootstrap-only base appliance closure.
          nix build --no-update-lock-file --no-link .#checks.x86_64-linux.appliance-boundary
          image_output="$(nix build --no-update-lock-file --no-link --print-out-paths .#runtime-appliance-image)"
          test -d "$image_output"
          echo "RUNTIME_APPLIANCE_IMAGE_OUTPUT=$image_output" >> "$GITHUB_ENV"

      - name: Generate and verify the canonical raw manifest and compressed envelope
        working-directory: nix
        shell: bash
        run: |
          set -euo pipefail
          mottainai_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.mottainai.version)"
          nawabari_version="$(nix eval --no-update-lock-file --raw .#packages.x86_64-linux.nawabari.version)"
          test "$mottainai_version" = "$RUNTIME_APPLIANCE_PACKAGE_VERSION"
          test -n "$nawabari_version"

          node ../scripts/build-runtime-appliance-manifest.mjs \
            --architecture x86_64-linux \
            --image-output "$RUNTIME_APPLIANCE_IMAGE_OUTPUT" \
            --source-revision "$RUNTIME_APPLIANCE_SOURCE_REVISION" \
            --mottainai-version "$mottainai_version" \
            --nawabari-version "$nawabari_version" \
            --output "$RUNNER_TEMP/runtime-appliance"

          directory="$RUNNER_TEMP/runtime-appliance/x86_64-linux"
          manifest="$directory/runtime-appliance-manifest.json"
          disk="$directory/mottainai-runtime-appliance.raw"
          test -s "$manifest"
          test -s "$disk"
          jq -e \
            --arg source_revision "$RUNTIME_APPLIANCE_SOURCE_REVISION" \
            --arg package_version "$RUNTIME_APPLIANCE_PACKAGE_VERSION" \
            '
              .contractId == "mottainai.linux-runtime-appliance.v1" and
              .schemaVersion == 1 and
              .architecture == "x86_64-linux" and
              .sourceRevision == $source_revision and
              .mottainaiVersion == $package_version and
              (.sourceRevision | test("^[0-9a-f]{40}$")) and
              (.nixSystemClosure | startswith("/nix/store/")) and
              .canonicalSource.flake == "nix/flake.nix" and
              .canonicalSource.output == "applianceConfigurations.x86_64-linux.config.system.build.toplevel" and
              .image.filename == "mottainai-runtime-appliance.raw" and
              .image.format == "raw" and
              ((.image.sizeBytes | type) == "number") and
              (.image.sizeBytes > 0) and
              (.image.sha256 | test("^[0-9a-f]{64}$"))
            ' "$manifest"
          MANIFEST="$manifest" DISK="$disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "../src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '

          compressed="$directory/mottainai-runtime-appliance.raw.zst"
          metadata="$directory/runtime-appliance-release-metadata.json"
          # Keep the canonical raw identity unchanged. This is a fixed
          # distribution-only transport envelope: zstd 19, single-threaded,
          # with an explicit zstd frame checksum.
          zstd --compress --ultra -19 --threads=1 --check --no-progress --force --keep \
            -o "$compressed" "$disk"
          compressed_size="$(stat -c '%s' "$compressed")"
          compressed_sha256="$(sha256sum "$compressed" | awk '{print $1}')"
          test -s "$compressed"
          test "$compressed_size" -lt 2147483648
          test "$(stat -c '%s' "$compressed")" = "$compressed_size"
          test "$(sha256sum "$compressed" | awk '{print $1}')" = "$compressed_sha256"

          jq -n \
            --arg source_revision "$RUNTIME_APPLIANCE_SOURCE_REVISION" \
            --arg manifest_filename "$(basename "$manifest")" \
            --arg asset_filename "$(basename "$compressed")" \
            --arg asset_sha256 "$compressed_sha256" \
            --argjson asset_size_bytes "$compressed_size" \
            '{
              contractId: "mottainai.linux-runtime-appliance-release.v1",
              schemaVersion: 1,
              architecture: "x86_64-linux",
              sourceRevision: $source_revision,
              canonicalManifest: $manifest_filename,
              compressedAsset: {
                filename: $asset_filename,
                format: "zstd",
                sizeBytes: $asset_size_bytes,
                sha256: $asset_sha256
              }
            }' > "$metadata"
          validate_release_metadata_bytes() {
            local metadata_file="$1"
            local manifest_filename="$2"
            local asset_filename="$3"
            local asset_size_bytes="$4"
            local asset_sha256="$5"
            jq -e \
              --arg source_revision "$RUNTIME_APPLIANCE_SOURCE_REVISION" \
              --arg manifest_filename "$manifest_filename" \
              --arg asset_filename "$asset_filename" \
              --arg asset_sha256 "$asset_sha256" \
              --argjson asset_size_bytes "$asset_size_bytes" \
              '
                .contractId == "mottainai.linux-runtime-appliance-release.v1" and
                .schemaVersion == 1 and
                .architecture == "x86_64-linux" and
                .sourceRevision == $source_revision and
                (.sourceRevision | test("^[0-9a-f]{40}$")) and
                .canonicalManifest == $manifest_filename and
                .compressedAsset.filename == $asset_filename and
                .compressedAsset.format == "zstd" and
                ((.compressedAsset.sizeBytes | type) == "number") and
                .compressedAsset.sizeBytes == $asset_size_bytes and
                (.compressedAsset.sha256 | test("^[0-9a-f]{64}$")) and
                .compressedAsset.sha256 == $asset_sha256
              ' "$metadata_file"
          }
          validate_release_metadata_bytes \
            "$metadata" \
            "$(basename "$manifest")" \
            "$(basename "$compressed")" \
            "$compressed_size" \
            "$compressed_sha256"
          test "$(jq -r '.sourceRevision' "$metadata")" = "$(jq -r '.sourceRevision' "$manifest")"

          roundtrip_directory="$RUNNER_TEMP/runtime-appliance-roundtrip"
          mkdir -p "$roundtrip_directory"
          roundtrip_disk="$roundtrip_directory/mottainai-runtime-appliance.raw"
          zstd --decompress --no-progress --force \
            -o "$roundtrip_disk" "$compressed"
          cmp -- "$disk" "$roundtrip_disk"
          MANIFEST="$manifest" DISK="$roundtrip_disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "../src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '

          {
            echo "RUNTIME_APPLIANCE_DIRECTORY=$directory"
            echo "RUNTIME_APPLIANCE_COMPRESSED_ASSET=$compressed"
            echo "RUNTIME_APPLIANCE_MANIFEST=$manifest"
            echo "RUNTIME_APPLIANCE_RELEASE_METADATA=$metadata"
          } >> "$GITHUB_ENV"

      # ORAS is used for arbitrary OCI artifact files. This intentionally stays
      # separate from the #627 image/closure implementation. The final
      # bootstrap-only boundary is checked during the build below; the OCI
      # mechanics consume only the resulting raw/manifest/metadata files.
      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.2.0

      - name: Publish and round-trip verify the Runtime Appliance OCI Artifact
        id: publish_oci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail

          compressed="$RUNTIME_APPLIANCE_COMPRESSED_ASSET"
          manifest="$RUNTIME_APPLIANCE_MANIFEST"
          metadata="$RUNTIME_APPLIANCE_RELEASE_METADATA"
          test -s "$compressed"
          test -s "$manifest"
          test -s "$metadata"

          # Current release tags are vMAJOR.MINOR.PATCH (optionally with a
          # prerelease suffix). They remain a compatibility locator in this
          # dedicated repository; neither this tag nor contract-v1 is identity.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "unsupported Runtime Appliance release tag for OCI locator: $RELEASE_TAG" >&2
            exit 1
          fi
          oci_version_tag="$RELEASE_TAG"
          oci_contract_tag="contract-v1"

          if [[ ! "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "GITHUB_REPOSITORY is not a safe OCI repository source: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          oci_repository="ghcr.io/${GITHUB_REPOSITORY,,}/runtime-appliance"
          oci_artifact_type="application/vnd.mottainai.runtime.appliance.v1"
          oci_manifest_media_type="application/vnd.oci.image.manifest.v1+json"
          oci_raw_media_type="application/vnd.mottainai.runtime.appliance.raw.v1+zstd"
          oci_manifest_layer_media_type="application/vnd.mottainai.runtime.appliance.manifest.v1+json"
          oci_metadata_layer_media_type="application/vnd.mottainai.runtime.appliance.release-metadata.v1+json"

          # GITHUB_TOKEN is scoped to packages:write above. No contents:write
          # or release mutation capability is granted to this job.
          printf '%s' "$GH_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

          compressed_name="$(basename "$compressed")"
          manifest_name="$(basename "$manifest")"
          metadata_name="$(basename "$metadata")"
          compressed_size="$(stat -c '%s' "$compressed")"
          manifest_size="$(stat -c '%s' "$manifest")"
          metadata_size="$(stat -c '%s' "$metadata")"
          compressed_sha256="$(sha256sum "$compressed" | awk '{print $1}')"
          compressed_digest="sha256:$compressed_sha256"
          manifest_digest="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
          metadata_digest="sha256:$(sha256sum "$metadata" | awk '{print $1}')"
          test "$compressed_size" -gt 0
          test "$manifest_size" -gt 0
          test "$metadata_size" -gt 0

          pushed_manifest="$RUNNER_TEMP/runtime-appliance-oci-manifest.json"
          # ORAS rejects absolute layer paths by default. Use the generated
          # staging directory as cwd so path validation remains enabled and
          # layer titles stay the exact artifact basenames.
          push_directory="$(dirname "$compressed")"
          (
            cd "$push_directory"
            oras push --no-tty \
              --image-spec v1.1 \
              --artifact-type "$oci_artifact_type" \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.revision=$RUNTIME_APPLIANCE_SOURCE_REVISION" \
              --annotation "org.opencontainers.image.version=$RUNTIME_APPLIANCE_PACKAGE_VERSION" \
              --export-manifest "$pushed_manifest" \
              "$oci_repository:$oci_version_tag" \
              "$compressed_name:$oci_raw_media_type" \
              "$manifest_name:$oci_manifest_layer_media_type" \
              "$metadata_name:$oci_metadata_layer_media_type"
          )

          validate_oci_manifest() {
            local oci_manifest_file="$1"
            jq -e \
              --arg artifact_type "$oci_artifact_type" \
              --arg manifest_media_type "$oci_manifest_media_type" \
              --arg raw_media_type "$oci_raw_media_type" \
              --arg manifest_layer_media_type "$oci_manifest_layer_media_type" \
              --arg metadata_layer_media_type "$oci_metadata_layer_media_type" \
              --arg raw_name "$compressed_name" \
              --arg manifest_name "$manifest_name" \
              --arg metadata_name "$metadata_name" \
              --arg raw_digest "$compressed_digest" \
              --arg manifest_digest "$manifest_digest" \
              --arg metadata_digest "$metadata_digest" \
              --argjson raw_size "$compressed_size" \
              --argjson manifest_size "$manifest_size" \
              --argjson metadata_size "$metadata_size" \
              '
                .schemaVersion == 2 and
                .mediaType == $manifest_media_type and
                .artifactType == $artifact_type and
                (.layers | length) == 3 and
                ([(.layers[] | .mediaType)] | sort) ==
                  ([$raw_media_type, $manifest_layer_media_type, $metadata_layer_media_type] | sort) and
                any(.layers[];
                  .mediaType == $raw_media_type and
                  .digest == $raw_digest and
                  .size == $raw_size and
                  .annotations["org.opencontainers.image.title"] == $raw_name) and
                any(.layers[];
                  .mediaType == $manifest_layer_media_type and
                  .digest == $manifest_digest and
                  .size == $manifest_size and
                  .annotations["org.opencontainers.image.title"] == $manifest_name) and
                any(.layers[];
                  .mediaType == $metadata_layer_media_type and
                  .digest == $metadata_digest and
                  .size == $metadata_size and
                  .annotations["org.opencontainers.image.title"] == $metadata_name)
              ' "$oci_manifest_file"
          }

          validate_release_metadata() {
            local metadata_file="$1"
            local manifest_filename="$2"
            local asset_filename="$3"
            local asset_size_bytes="$4"
            local asset_sha256="$5"
            local asset_digest="$6"
            jq -e \
              --arg source_revision "$RUNTIME_APPLIANCE_SOURCE_REVISION" \
              --arg manifest_filename "$manifest_filename" \
              --arg asset_filename "$asset_filename" \
              --arg asset_sha256 "$asset_sha256" \
              --arg asset_digest "$asset_digest" \
              --argjson asset_size_bytes "$asset_size_bytes" \
              '
                .contractId == "mottainai.linux-runtime-appliance-release.v1" and
                .schemaVersion == 1 and
                .architecture == "x86_64-linux" and
                .sourceRevision == $source_revision and
                (.sourceRevision | test("^[0-9a-f]{40}$")) and
                .canonicalManifest == $manifest_filename and
                .compressedAsset.filename == $asset_filename and
                .compressedAsset.format == "zstd" and
                ((.compressedAsset.sizeBytes | type) == "number") and
                .compressedAsset.sizeBytes == $asset_size_bytes and
                (.compressedAsset.sha256 | test("^[0-9a-f]{64}$")) and
                .compressedAsset.sha256 == $asset_sha256 and
                ("sha256:" + .compressedAsset.sha256) == $asset_digest
              ' "$metadata_file"
          }

          # Validate the exact manifest ORAS generated before resolving its
          # registry descriptor. The descriptor digest below is authoritative.
          validate_oci_manifest "$pushed_manifest"
          validate_release_metadata \
            "$metadata" \
            "$manifest_name" \
            "$compressed_name" \
            "$compressed_size" \
            "$compressed_sha256" \
            "$compressed_digest"

          descriptor="$RUNNER_TEMP/runtime-appliance-oci-descriptor.json"
          oras manifest fetch --no-tty --descriptor "$oci_repository:$oci_version_tag" > "$descriptor"
          oci_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$descriptor")"
          oci_digest_ref="$oci_repository@$oci_digest"
          test -n "$oci_digest"

          # The slower-changing contract locator is deliberately only an alias
          # to the already-resolved digest. Operators must use the digest ref
          # below for identity and verification.
          oras tag --no-tty "$oci_digest_ref" "$oci_contract_tag"
          contract_descriptor="$RUNNER_TEMP/runtime-appliance-oci-contract-descriptor.json"
          oras manifest fetch --no-tty --descriptor "$oci_repository:$oci_contract_tag" > "$contract_descriptor"
          test "$(jq -er '.digest' "$contract_descriptor")" = "$oci_digest"

          remote_oci_manifest="$RUNNER_TEMP/runtime-appliance-oci-remote-manifest.json"
          oras manifest fetch --no-tty --pretty "$oci_digest_ref" > "$remote_oci_manifest"
          validate_oci_manifest "$remote_oci_manifest"
          remote_raw_descriptor="$(jq -er \
            --arg raw_media_type "$oci_raw_media_type" \
            '[.layers[] | select(.mediaType == $raw_media_type)] | if length == 1 then .[0] else empty end' \
            "$remote_oci_manifest")"
          remote_raw_digest="$(printf '%s' "$remote_raw_descriptor" | jq -er \
            '.digest | select(type == "string") | select(test("^sha256:[0-9a-f]{64}$"))')"
          remote_raw_size="$(printf '%s' "$remote_raw_descriptor" | jq -er \
            '.size | select(type == "number") | select(. >= 0 and . == floor)')"

          downloaded="$RUNNER_TEMP/runtime-appliance-oci-roundtrip"
          mkdir -p "$downloaded"
          oras pull --no-tty --output "$downloaded" "$oci_digest_ref"
          remote_compressed="$downloaded/$compressed_name"
          remote_manifest="$downloaded/$manifest_name"
          remote_metadata="$downloaded/$metadata_name"
          test -s "$remote_compressed"
          test -s "$remote_manifest"
          test -s "$remote_metadata"
          cmp -- "$compressed" "$remote_compressed"
          cmp -- "$manifest" "$remote_manifest"
          cmp -- "$metadata" "$remote_metadata"

          remote_size="$(stat -c '%s' "$remote_compressed")"
          remote_sha256="$(sha256sum "$remote_compressed" | awk '{print $1}')"
          test "$remote_size" -lt 2147483648
          test "$remote_size" = "$remote_raw_size"
          test "sha256:$remote_sha256" = "$remote_raw_digest"
          validate_release_metadata \
            "$remote_metadata" \
            "$(basename "$remote_manifest")" \
            "$(basename "$remote_compressed")" \
            "$remote_raw_size" \
            "$remote_sha256" \
            "$remote_raw_digest"
          test "$(jq -r '.sourceRevision' "$remote_metadata")" = "$(jq -r '.sourceRevision' "$remote_manifest")"

          remote_disk="$downloaded/mottainai-runtime-appliance.raw"
          zstd --decompress --no-progress --force \
            -o "$remote_disk" "$remote_compressed"
          MANIFEST="$remote_manifest" DISK="$remote_disk" node --import tsx --input-type=module -e '
            import { readRuntimeApplianceManifest, verifyRuntimeApplianceManifest } from "./src/runtime-contract/appliance-manifest.ts";
            const manifest = readRuntimeApplianceManifest(process.env.MANIFEST);
            verifyRuntimeApplianceManifest(manifest, process.env.DISK);
          '

          echo "digest=$oci_digest" >> "$GITHUB_OUTPUT"
          echo "ref=$oci_digest_ref" >> "$GITHUB_OUTPUT"
          echo "raw_sha256=$(jq -er '.image.sha256' "$remote_manifest")" >> "$GITHUB_OUTPUT"
          echo "raw_size_bytes=$(jq -er '.image.sizeBytes' "$remote_manifest")" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum "$remote_manifest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_APPLIANCE_OCI_DIGEST=$oci_digest" >> "$GITHUB_ENV"
          echo "RUNTIME_APPLIANCE_OCI_REF=$oci_digest_ref" >> "$GITHUB_ENV"
          {
            echo "### Runtime Appliance OCI Artifact"
            echo "- digest (authoritative): \`$oci_digest\`"
            echo "- digest ref: \`$oci_digest_ref\`"
            echo "- convenience tags: \`$oci_version_tag\`, \`$oci_contract_tag\`"
            echo "- artifact type: \`$oci_artifact_type\`"
          } >> "$GITHUB_STEP_SUMMARY"

  host-bootstrap-init:
    name: Publish mottainai-init release artifact
    # #660: a durable, versioned, independently verifiable distribution
    # surface for the standalone host bootstrap binary. This is unrelated to
    # the npm package and does not depend on it; it does not add any Lima
    # orchestration or Runtime Appliance publication behavior. It runs
    # against the still-draft release from prepare-release: draft release
    # assets are always mutable (#726), so this upload never races
    # publication immutability the way it did under the old
    # release: published trigger.
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tagged release revision
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse --verify HEAD)"
          test "$checked_out_commit" = "$tag_commit"
          echo "HOST_BOOTSTRAP_SOURCE_REVISION=$tag_commit" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install portable Linux target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build the portable release artifact from the locked package definition
        working-directory: host-bootstrap
        run: |
          set -euo pipefail
          cargo build --locked --target x86_64-unknown-linux-musl --release
          cp target/x86_64-unknown-linux-musl/release/mottainai-init mottainai-init-linux-x86_64
          file mottainai-init-linux-x86_64 | grep -E 'static(-pie)? linked|musl'
          if readelf -d mottainai-init-linux-x86_64 | grep -q NEEDED; then
            echo 'portable artifact unexpectedly has dynamic dependencies' >&2
            exit 1
          fi
          if readelf -l mottainai-init-linux-x86_64 | grep -q INTERP; then
            echo 'portable artifact unexpectedly has a dynamic loader' >&2
            exit 1
          fi
          ./mottainai-init-linux-x86_64 --version
          sha256sum mottainai-init-linux-x86_64 > mottainai-init-linux-x86_64.sha256
          echo "HOST_BOOTSTRAP_ARTIFACT_DIGEST=$(awk '{print $1}' mottainai-init-linux-x86_64.sha256)" >> "$GITHUB_ENV"

      - name: Publish the release artifact, failing closed on any identity change
        working-directory: host-bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if grep -qx 'mottainai-init-linux-x86_64.sha256' <<<"$asset_names"; then
            gh release download "$RELEASE_TAG" \
              --pattern 'mottainai-init-linux-x86_64.sha256' \
              --output existing-mottainai-init-linux-x86_64.sha256 \
              --clobber
            published_digest="$(awk '{print $1}' existing-mottainai-init-linux-x86_64.sha256)"
            if [ "$published_digest" != "$HOST_BOOTSTRAP_ARTIFACT_DIGEST" ]; then
              echo "published mottainai-init-linux-x86_64 digest ($published_digest) does not match this build ($HOST_BOOTSTRAP_ARTIFACT_DIGEST); refusing to replace an artifact already recorded for this release" >&2
              exit 1
            fi
            echo "identical bytes already published for $RELEASE_TAG; publication is idempotent"
          else
            gh release upload "$RELEASE_TAG" \
              mottainai-init-linux-x86_64 \
              mottainai-init-linux-x86_64.sha256
          fi

      - name: Retrieve and verify the published artifact from a fresh location
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fresh_dir="$RUNNER_TEMP/mottainai-init-fresh-fetch"
          mkdir -p "$fresh_dir"
          # The release is still a draft at this point, so the assets are not
          # yet reachable at the public releases/download URL; fetch them
          # through the API the same way any draft-release asset must be.
          gh release download "$RELEASE_TAG" \
            --dir "$fresh_dir" \
            --pattern 'mottainai-init-linux-x86_64*' \
            --clobber
          cd "$fresh_dir"
          sha256sum --check mottainai-init-linux-x86_64.sha256
          fetched_digest="$(awk '{print $1}' mottainai-init-linux-x86_64.sha256)"
          if [ "$fetched_digest" != "$HOST_BOOTSTRAP_ARTIFACT_DIGEST" ]; then
            echo "published artifact digest ($fetched_digest) does not match the built artifact ($HOST_BOOTSTRAP_ARTIFACT_DIGEST)" >&2
            exit 1
          fi
          chmod +x mottainai-init-linux-x86_64
          ./mottainai-init-linux-x86_64 --version

      - name: Record release evidence
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          {
            echo "### mottainai-init release artifact"
            echo "- release tag: \`$RELEASE_TAG\`"
            echo "- source revision: \`$HOST_BOOTSTRAP_SOURCE_REVISION\`"
            echo "- binary digest (sha256): \`$HOST_BOOTSTRAP_ARTIFACT_DIGEST\`"
            echo "- publication reference: \`https://github.com/${GITHUB_REPOSITORY}/releases/download/$RELEASE_TAG/mottainai-init-linux-x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-descriptor:
    name: Publish immutable deployment descriptor
    # #755: fan in independently completed release surfaces only after their
    # exact identities are available. The descriptor remains a draft-release
    # asset until finalize-release publishes the immutable release.
    needs: [prepare-release, build, runtime-appliance, host-bootstrap-init]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Install descriptor validator dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the canonical Route 1 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mottainai-tarball

      - name: Download the exact Route 4 init artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'mottainai-init-linux-x86_64' --dir "$RUNNER_TEMP/init" --clobber

      - name: Assemble and validate the release descriptor
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_REVISION: ${{ github.sha }}
          OCI_DIGEST: ${{ needs.runtime-appliance.outputs.oci_digest }}
          RAW_SHA256: ${{ needs.runtime-appliance.outputs.raw_sha256 }}
          RAW_SIZE_BYTES: ${{ needs.runtime-appliance.outputs.raw_size_bytes }}
          MANIFEST_SHA256: ${{ needs.runtime-appliance.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tarball="$(find . -maxdepth 1 -type f -name 'mottainai-*.tgz' -print -quit)"
          node scripts/verify-canonical-payload.mjs --tarball "$tarball" --identity "$tarball.identity.json"
          lock_sha256="$(sha256sum nix/flake.lock | awk '{print $1}')"
          payload_sha256="$(jq -er '.payload.sha256' "$tarball.identity.json")"
          test "$payload_sha256" = "$(sha256sum "$tarball" | awk '{print $1}')"
          managed_identity="$(printf '%s' "$version:$SOURCE_REVISION:$payload_sha256:$lock_sha256" | sha256sum | awk '{print $1}')"
          # Route 2 identity inputs are release-bound and payload-bound; the
          # owning Nix build may replace this fan-in file with its realized
          # NAR identities, but no descriptor is accepted without one.
          jq -n \
            --arg identity "$managed_identity" \
            --arg lock "$lock_sha256" \
            --arg payload "$payload_sha256" \
            --arg version "$version" \
            '{identity:$identity, flakeLockSha256:$lock, applicationPayloadSha256:$payload, packages:[{packageId:"mottainai",version:$version,flakeRef:"nix#mottainai",sourceSha256:$payload}]}' \
            > "$RUNNER_TEMP/managed-generation.json"
          jq -n \
            --arg digest "$OCI_DIGEST" \
            --arg raw "$RAW_SHA256" \
            --argjson size "$RAW_SIZE_BYTES" \
            --arg manifest "$MANIFEST_SHA256" \
            '{digest:$digest,rawSha256:$raw,rawSizeBytes:$size,manifestSha256:$manifest}' \
            > "$RUNNER_TEMP/appliance-metadata.json"
          node scripts/create-release-deployment-descriptor-input.mjs \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --tarball "$tarball" \
            --init "$RUNNER_TEMP/init/mottainai-init-linux-x86_64" \
            --appliance-metadata "$RUNNER_TEMP/appliance-metadata.json" \
            --provider-profile release/deployment-provider-profile-linux-x86_64.json \
            --managed-generation "$RUNNER_TEMP/managed-generation.json" \
            --output "$RUNNER_TEMP/deployment-descriptor-input.json"
          node --import tsx scripts/build-deployment-descriptor.mjs \
            --input "$RUNNER_TEMP/deployment-descriptor-input.json" \
            --output mottainai-deployment-v1.json \
            --identity-output mottainai-deployment-v1.json.sha256

      - name: Publish descriptor assets idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if grep -qx 'mottainai-deployment-v1.json.sha256' <<<"$assets"; then
            gh release download "$RELEASE_TAG" --pattern 'mottainai-deployment-v1.json*' --dir "$RUNNER_TEMP/existing-descriptor" --clobber
            cmp -- mottainai-deployment-v1.json.sha256 "$RUNNER_TEMP/existing-descriptor/mottainai-deployment-v1.json.sha256"
            cmp -- mottainai-deployment-v1.json "$RUNNER_TEMP/existing-descriptor/mottainai-deployment-v1.json"
          else
            gh release upload "$RELEASE_TAG" mottainai-deployment-v1.json mottainai-deployment-v1.json.sha256
          fi
          {
            echo "### Deployment descriptor"
            echo "- release: \`$RELEASE_TAG\`"
            echo "- identity: \`$(awk '{print $1}' mottainai-deployment-v1.json.sha256)\`"
            echo "- asset: \`mottainai-deployment-v1.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retrieve and verify descriptor from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/descriptor-fresh"
          gh release download "$RELEASE_TAG" --pattern 'mottainai-deployment-v1.json*' --dir "$RUNNER_TEMP/descriptor-fresh" --clobber
          cd "$RUNNER_TEMP/descriptor-fresh"
          sha256sum --check mottainai-deployment-v1.json.sha256

  finalize-release:
    name: Publish the GitHub Release
    # #726: this is the only step in the entire workflow permitted to flip
    # the release from draft to published. It only runs once every
    # asset-producing job has succeeded, so immutability only ever starts
    # applying to a release whose assets are already complete. A failure in
    # any dependency leaves the release as a draft rather than publishing a
    # release with a missing or inconsistent asset.
    needs: [prepare-release, publish, runtime-appliance, host-bootstrap-init, deployment-descriptor]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

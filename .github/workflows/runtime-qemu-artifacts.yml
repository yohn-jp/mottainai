name: Build managed QEMU artifacts

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: managed QEMU (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-24.04
            target: x86_64-softmmu
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-softmmu
          - host: macos-x64
            runner: macos-13
            target: x86_64-softmmu
          - host: macos-arm64
            runner: macos-14
            target: aarch64-softmmu
          - host: windows-x64
            runner: windows-2025
            target: x86_64-softmmu

    env:
      QEMU_SOURCE_URL: https://download.qemu.org/qemu-9.2.2.tar.xz
      QEMU_SOURCE_SHA256: 752eaeeb772923a73d536b231e05bcc09c9b1f51690a41ad9973d900e4ec9fbf

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe502c1 # v7.0.0
        with:
          node-version: "24"

      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install --yes build-essential libglib2.0-dev libpixman-1-dev libfdt-dev ninja-build pkg-config zlib1g-dev

      - name: Install macOS build dependencies
        if: startsWith(matrix.runner, 'macos-')
        run: brew install meson ninja pkg-config

      - name: Install Windows build dependencies
        if: startsWith(matrix.runner, 'windows-')
        shell: pwsh
        run: choco install --no-progress --yes msys2 ninja

      - name: Build and stage pinned artifact
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          TARGET: ${{ matrix.target }}
        run: node scripts/build-runtime-qemu-source.mjs --host "$HOST" --target "$TARGET" --workdir "$RUNNER_TEMP/mottainai-qemu" --output "$RUNNER_TEMP/mottainai-qemu/artifact" --source-url "$QEMU_SOURCE_URL" --source-sha256 "$QEMU_SOURCE_SHA256"

      - name: Verify manifest and every packaged digest
        shell: bash
        env:
          HOST: ${{ matrix.host }}
        run: |
          node scripts/verify-runtime-qemu-artifact.mjs \
            --manifest "$RUNNER_TEMP/mottainai-qemu/artifact/$HOST/qemu-$HOST-9.2.2.manifest.json" \
            --artifact-root "$RUNNER_TEMP/mottainai-qemu/artifact/$HOST/qemu-$HOST-9.2.2"

      - name: Artifact-level boot smoke
        shell: bash
        env:
          HOST: ${{ matrix.host }}
        run: |
          node scripts/runtime-qemu-boot-smoke.mjs \
            --manifest "$RUNNER_TEMP/mottainai-qemu/artifact/$HOST/qemu-$HOST-9.2.2.manifest.json" \
            --artifact-root "$RUNNER_TEMP/mottainai-qemu/artifact/$HOST/qemu-$HOST-9.2.2"

      - name: Upload managed artifact contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mottainai-qemu-${{ matrix.host }}
          path: ${{ runner.temp }}/mottainai-qemu/artifact/${{ matrix.host }}
          if-no-files-found: error
          retention-days: 14

name: Golden Path Bring-up Patch

on:
  push:
    branches: [chore/487-golden-path-bringup]

permissions:
  contents: write

jobs:
  patch-484:
    if: ${{ !contains(github.event.head_commit.message, '(#484)') && !contains(github.event.head_commit.message, 'remove temporary golden-path patch executor') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: chore/487-golden-path-bringup
      - name: Apply exact #484 recovery patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/workflow/commands/write.ts')
          text = path.read_text()
          old = '''    // Nawabari's push.v1 performs the authoritative generation inspection. Recovery
              // never reuses the original force/upstream intent: force is disabled and the
              // target must already be at the recorded source generation. Thus an advanced
              // remote is rejected by Nawabari before any overwrite can be attempted.
              const observed = await nawabari.push({
                cwd: workspaceRoot,
                sessionId: receipt.nawabariSessionId,
                remote: receipt.remote,
                branch: receipt.targetBranch,
                resources,
                force: false,
                createUpstream: false,
              });'''
          new = '''    // Nawabari's push.v1 performs the authoritative generation inspection. Recovery
              // never reuses persisted force/upstream intent. Force is always disabled. A fresh
              // explicit --create-upstream on the current invocation may be honored so an earlier
              // PUSH_NO_UPSTREAM does not poison retry; Nawabari still verifies source generation
              // before any remote mutation.
              const observed = await nawabari.push({
                cwd: workspaceRoot,
                sessionId: receipt.nawabariSessionId,
                remote: receipt.remote,
                branch: receipt.targetBranch,
                resources,
                force: false,
                createUpstream: pushInput.createUpstream === true,
              });'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one #484 patch site, found {count}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit #484
        run: |
          git config user.name 'mottainai-golden-path'
          git config user.email 'actions@users.noreply.github.com'
          git add src/workflow/commands/write.ts
          git diff --cached --check
          git commit -m 'fix(workflow): honor explicit upstream creation on push retry (#484)'
          git push origin HEAD:chore/487-golden-path-bringup

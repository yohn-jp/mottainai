name: PR-Agent

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  eligibility:
    # Cheap entry filter: run only for pull_request events, or non-bot comments on a PR.
    # The fork check itself (which needs an API call for issue_comment events, since that
    # payload has no head.repo info) happens inside the script step below.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      base_ref: ${{ steps.check.outputs.base_ref }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Verify internal PR and trusted commenter
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              const ok = pullRequest.head.repo.full_name === repoFullName;
              core.setOutput('ok', ok);
              if (ok) {
                core.setOutput('base_ref', pullRequest.base.ref);
                core.setOutput('base_sha', pullRequest.base.sha);
                core.setOutput('head_sha', pullRequest.head.sha);
                core.setOutput('pr_number', pullRequest.number);
              }
              return;
            }

            // issue_comment: restrict to trusted authors, then resolve the PR to
            // confirm it isn't fork-originated (not present on the comment payload).
            const trustedAssociations = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (
              !trustedAssociations.includes(context.payload.comment.author_association) ||
              context.payload.comment.body.trim() !== '/qodo-review'
            ) {
              core.setOutput('ok', false);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const ok = pr.head.repo.full_name === repoFullName;
            core.setOutput('ok', ok);
            if (ok) {
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('pr_number', pr.number);
            }

  pr-agent:
    needs: eligibility
    if: needs.eligibility.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch reviewed pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --no-tags origin "pull/${PR_NUMBER}/head"

      - name: Run bounded review preflight
        id: preflight
        env:
          REVIEWER: PR-Agent
          REVIEW_MODEL: ${{ vars.PR_AGENT_MODEL || 'openai/moonshotai/Kimi-K3' }}
          REVIEW_CONTEXT_TOKENS: ${{ vars.PR_AGENT_CONTEXT_TOKENS || '32768' }}
          REVIEW_OUTPUT_RESERVE_TOKENS: ${{ vars.PR_AGENT_OUTPUT_RESERVE_TOKENS || '8192' }}
          REVIEW_SAFETY_MARGIN_TOKENS: ${{ vars.PR_AGENT_SAFETY_MARGIN_TOKENS || '2048' }}
          REVIEW_BUDGET_EXPLICIT: ${{ vars.PR_AGENT_CONTEXT_TOKENS != '' && vars.PR_AGENT_OUTPUT_RESERVE_TOKENS != '' && vars.PR_AGENT_SAFETY_MARGIN_TOKENS != '' }}
          # CUSTOM_MODEL_MAX_TOKENS applies prompt input sizing/clipping in
          # PR-Agent; it is not a provider-side request cap.
          REVIEW_PROVIDER_REQUEST_BOUND: "true"
          REVIEW_BASE_SHA: ${{ needs.eligibility.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ needs.eligibility.outputs.head_sha }}
          REVIEW_PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
          REVIEW_REPO_CONTEXT_MAX_LINES: "240"
          REVIEW_NORMALIZE_PR_AGENT_COMMAND: "true"
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: node scripts/review-preflight.mjs

      - name: PR Agent action step
        id: review
        if: >-
          steps.preflight.outputs.status == 'ready' &&
          steps.preflight.outputs.provider_invocation_allowed == 'true'
        uses: qodo-ai/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI.API_BASE: "https://api.featherless.ai/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.GIT_PROVIDER: "github"
          CONFIG.MODEL: ${{ vars.PR_AGENT_MODEL || 'openai/moonshotai/Kimi-K3' }}
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: ${{ steps.preflight.outputs.maximum_input_tokens }}
          CONFIG.REPO_CONTEXT_FILES: '["AGENTS.md"]'
          CONFIG.REPO_CONTEXT_MAX_LINES: "240"
          CONFIG.EXTRACT_ISSUE_FROM_BRANCH: "false"
          CONFIG.MAX_DESCRIPTION_TOKENS: "500"
          CONFIG.MAX_COMMITS_TOKENS: "500"
          pr_reviewer.require_ticket_analysis_review: "false"
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

      - name: Publish PR-Agent outcome
        if: always()
        env:
          PREFLIGHT_STATUS: ${{ steps.preflight.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.status }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          REVIEW_STATUS: ${{ steps.review.outcome }}
          REVIEW_MODEL: ${{ vars.PR_AGENT_MODEL || 'openai/moonshotai/Kimi-K3' }}
          REVIEW_CONTEXT_TOKENS: ${{ steps.preflight.outputs.total_context_tokens }}
          REVIEW_OUTPUT_RESERVE_TOKENS: ${{ steps.preflight.outputs.reserved_output_tokens }}
          REVIEW_SAFETY_MARGIN_TOKENS: ${{ steps.preflight.outputs.safety_margin_tokens }}
          REVIEW_MAX_INPUT_TOKENS: ${{ steps.preflight.outputs.maximum_input_tokens }}
          REVIEW_INPUT_TOKENS: ${{ steps.preflight.outputs.estimated_input_tokens }}
          INPUT_BOUND_APPLIED: ${{ steps.preflight.outputs.provider_request_bound }}
          PROVIDER_ALLOWED: ${{ steps.preflight.outputs.provider_invocation_allowed }}
          CHUNKING: ${{ steps.preflight.outputs.chunking }}
          PASS_COUNT: ${{ steps.preflight.outputs.passes }}
          CHUNK_COUNT: ${{ steps.preflight.outputs.chunks }}
        run: |
          {
            echo "### PR-Agent outcome"
            echo "- Preflight step: ${PREFLIGHT_STATUS:-unavailable}"
            echo "- Preflight result: ${PREFLIGHT_RESULT:-unavailable}"
            echo "- Model: ${REVIEW_MODEL:-unavailable}"
            echo "- Budget: context=${REVIEW_CONTEXT_TOKENS:-unavailable}, output-reserve=${REVIEW_OUTPUT_RESERVE_TOKENS:-unavailable}, safety-margin=${REVIEW_SAFETY_MARGIN_TOKENS:-unavailable}, effective-input=${REVIEW_MAX_INPUT_TOKENS:-unavailable}"
            echo "- Estimated input: ${REVIEW_INPUT_TOKENS:-unavailable}"
            echo "- PR-Agent prompt input bound applied: ${INPUT_BOUND_APPLIED:-false} (prompt clipping/input sizing; not a provider-side request cap)"
            echo "- Credentialed provider invocation allowed: ${PROVIDER_ALLOWED:-false}"
            echo "- Chunking: ${CHUNKING:-false}"
            echo "- Passes: ${PASS_COUNT:-0}"
            echo "- Chunks: ${CHUNK_COUNT:-0}"
            echo "- Review action step: ${REVIEW_STATUS:-not_started}"
            echo "- Reason: ${PREFLIGHT_REASON:-unavailable}"
            if [ "${REVIEW_STATUS:-}" = "success" ]; then
              echo "- Status: review_generated"
            else
              echo "- Status: review_not_generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Golden Path Docs Sync
on:
  push:
    branches: [chore/487-golden-path-bringup]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'sync testing evidence docs (#486)') && !contains(github.event.head_commit.message, 'remove temporary #486 docs sync') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: chore/487-golden-path-bringup
      - name: Synchronize docs
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('docs/testing.md')
          s = p.read_text()
          s,n1 = re.subn(r'(?m)^\s*→ PR governance evidence$', '        → Inari PR contract + executable CI results', s, count=1)
          s,n2 = re.subn(
            r'(?m)^\| #26 path-aware governance \|.*$',
            '| #26 PR governance | Inari compiled PR contract、[`scripts/governance-rules.json`](../scripts/governance-rules.json)、[`scripts/governance-lib.mjs`](../scripts/governance-lib.mjs)、[`.github/workflows/governance.yml`](../.github/workflows/governance.yml) | `governance:test`、`governance:pr` | PR body shapeはInariが単独authority。repository側はbranch/title/Validation completion等の独立checkだけを追加し、実行証跡はCI job/artifactを正本とする |',
            s,
            count=1,
          )
          s,n3 = re.subn(
            r'quality evidenceのpath-aware判定とregression proofも現行はreport-onlyである（詳細は\[`governance\.md`\]\(governance\.md\)）。',
            'PR bodyに別のquality-evidence/regression-proof schemaは要求しない。詳細な実行証跡は各CI job/artifactを正本とする（詳細は[`governance.md`](governance.md)）。',
            s,
            count=1,
          )
          s,n4 = re.subn(
            r'\n## Governance evidence classes\n.*?(?=\n## )',
            '\n## PR validation and executable evidence\n\nPRのbody shapeはcompiled Inari contractが単独authorityであり、現在のdefaultは`Summary / Linked issue / Changes / Validation / Review focus`である。`Validation evidence`、`Regression proof`等の追加body sectionをtest tierから逆算して必須化しない。Fast / Integration / E2E / Package / Standards / Coverageの詳細結果は、それぞれのCI job・artifactを実行証跡の正本とする。`Validation`のTypecheck / Tests / Build（および条件付きPackage check）は、実際に該当checkが完了した場合だけチェックする。\n',
            s,
            count=1,
            flags=re.S,
          )
          if (n1,n2,n3,n4) != (1,1,1,1):
            raise SystemExit(f'unexpected testing.md patch counts: {(n1,n2,n3,n4)}')
          p.write_text(s)

          q = Path('docs/quality-evidence-providers.md')
          t = q.read_text()
          marker = '## Scope and baseline\n'
          if marker not in t:
            raise SystemExit('quality evidence scope marker missing')
          note = '## Scope and baseline\n\n> Governance note: this is a historical/research evaluation of external analyzers. External quality facts and the evidence-provider vocabulary below do **not** define the current pull-request body schema. The compiled Inari PR contract is the sole PR body-shape authority; executable analyzer/test results belong in their owning CI/provider outputs.\n'
          t = t.replace(marker, note, 1)
          q.write_text(t)
      - name: Commit docs
        run: |
          git config user.name 'mottainai-golden-path'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/testing.md docs/quality-evidence-providers.md
          git diff --cached --check
          git commit -m 'docs(workflow): sync testing evidence docs (#486)'
          git push origin HEAD:chore/487-golden-path-bringup

name: Golden Path 484 Test Patch
on:
  push:
    branches: [chore/487-golden-path-bringup]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'cover create-upstream push retry (#484)') && !contains(github.event.head_commit.message, 'remove temporary #484 test patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: chore/487-golden-path-bringup
      - name: Patch focused regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/workflow/commands/write.test.ts')
          s = p.read_text()
          old_import = 'import { NawabariExecutionClient, type NawabariPushResult } from "../nawabari.js";'
          new_import = 'import { NawabariExecutionClient, NawabariExecutionError, type NawabariPushResult } from "../nawabari.js";'
          if s.count(old_import) != 1:
            raise SystemExit('unexpected Nawabari import count')
          s = s.replace(old_import, new_import, 1)
          marker = 'test("push receipt recovers a successful external push after lifecycle persistence fails and a process restarts", async (t) => {'
          if s.count(marker) != 1:
            raise SystemExit('unexpected push receipt marker count')
          addition = r'''
          class RetryUpstreamNawabari extends PushEvidenceNawabari {
            readonly createUpstreamCalls: boolean[] = [];

            override async push(input: Parameters<NawabariExecutionClient["push"]>[0]): Promise<NawabariPushResult> {
              this.pushCalls += 1;
              this.createUpstreamCalls.push(input.createUpstream === true);
              if (input.createUpstream !== true) {
                throw new NawabariExecutionError(
                  "nawabari-rejected",
                  "PUSH_NO_UPSTREAM: no upstream is configured",
                  "PUSH_NO_UPSTREAM",
                );
              }
              const source = runGit(["rev-parse", "HEAD"], input.cwd);
              return {
                ok: true,
                command: "push",
                source_sha: source,
                remote: input.remote,
                branch: input.branch,
                target: `${input.remote}/${input.branch}`,
                target_ref: `refs/heads/${input.branch}`,
                observed_remote_sha: source,
                relation: "up-to-date",
              };
            }
          }

          test("push retry honors a fresh explicit create-upstream after PUSH_NO_UPSTREAM", async (t) => {
            const root = createTempGitRepo(t);
            const store = createWorkflowStore(t);
            const nawabari = new RetryUpstreamNawabari();
            const started = await startNawabariTask({
              workspaceRoot: root,
              store,
              policy: BUILTIN_PRESETS.standard,
              taskSlug: "push-retry-upstream",
              branchType: "fix",
              issueRef: "484",
              nawabari,
            });
            assert.equal(started.ok, true, JSON.stringify(started));
            if (!started.ok) return;
            t.after(() =>
              nawabari
                .closeSession({ cwd: started.execution.worktree, sessionId: started.execution.sessionId })
                .catch(() => undefined),
            );
            fs.appendFileSync(path.join(started.execution.worktree, "file.txt"), "retry upstream\n");
            const committed = await commitWorkflowTask({
              workspaceRoot: root,
              store,
              taskId: started.task.taskId,
              policy: BUILTIN_PRESETS.standard,
              message: { subject: "push retry upstream" },
              nawabari,
            });
            assert.equal(committed.ok, true, JSON.stringify(committed));

            const first = await pushWorkflowTask({
              workspaceRoot: root,
              store,
              taskId: started.task.taskId,
              policy: BUILTIN_PRESETS.standard,
              remote: "origin",
              nawabari,
            });
            assert.equal(first.ok, false, JSON.stringify(first));
            if (!first.ok) assert.match(first.detail ?? "", /PUSH_NO_UPSTREAM/u);
            assert.equal(store.getPushReconciliation(started.task.taskId)?.state, "ambiguous");

            const retry = await pushWorkflowTask({
              workspaceRoot: root,
              store,
              taskId: started.task.taskId,
              policy: BUILTIN_PRESETS.standard,
              remote: "origin",
              createUpstream: true,
              nawabari,
            });
            assert.equal(retry.ok, true, JSON.stringify(retry));
            assert.deepEqual(nawabari.createUpstreamCalls, [false, true]);
            assert.equal(store.getTask(started.task.taskId)?.lifecycleState, "pushed");
            assert.equal(store.getPushReconciliation(started.task.taskId)?.state, "reconciled");
          });

          '''
          p.write_text(s.replace(marker, addition + marker, 1))
      - name: Commit regression
        run: |
          git config user.name 'mottainai-golden-path'
          git config user.email 'actions@users.noreply.github.com'
          git add src/workflow/commands/write.test.ts
          git diff --cached --check
          git commit -m 'test(workflow): cover create-upstream push retry (#484)'
          git push origin HEAD:chore/487-golden-path-bringup

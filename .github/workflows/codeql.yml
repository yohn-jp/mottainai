name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The weekly run catches newly published CodeQL queries and newly recognized
  # vulnerabilities even when the repository has not changed.
  schedule:
    - cron: "31 3 * * 1"

# Start from no token permissions. The analysis job grants only the two scopes
# required to read the checkout and upload code-scanning results.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

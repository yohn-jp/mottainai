name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The weekly run catches newly published CodeQL queries and newly recognized
  # vulnerabilities even when the repository has not changed.
  schedule:
    - cron: "31 3 * * 1"

# Start from no token permissions. The analysis job grants only the two scopes
# required to read the checkout and upload code-scanning results.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Preserve push and scheduled analysis. Only normal pull_request events
    # enter this job, so excluded PRs do not consume CodeQL runners.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"

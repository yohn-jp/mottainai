name: Test effectiveness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  property-mutation:
    name: bounded property and mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Property tests
        run: pnpm run test:property -- --seed 240824 --runs 48 --report "$RUNNER_TEMP/property-report.json"

      - name: Targeted mutation tests
        run: pnpm run test:mutation -- --seed 240824 --runs 48 --timeout-ms 15000 --report "$RUNNER_TEMP/mutation-report.json"

      - name: Upload effectiveness reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-effectiveness-node-22
          path: |
            ${{ runner.temp }}/property-report.json
            ${{ runner.temp }}/mutation-report.json
          if-no-files-found: warn

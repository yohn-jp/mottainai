name: Test effectiveness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  property-mutation:
    name: bounded property and mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Property tests
        run: pnpm run test:property -- --seed 240824 --runs 48 --report "$RUNNER_TEMP/property-report.json"

      - name: Targeted mutation tests
        run: pnpm run test:mutation -- --seed 240824 --runs 48 --timeout-ms 15000 --report "$RUNNER_TEMP/mutation-report.json"

      - name: Upload effectiveness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-effectiveness-node-22
          path: |
            ${{ runner.temp }}/property-report.json
            ${{ runner.temp }}/mutation-report.json
          if-no-files-found: warn

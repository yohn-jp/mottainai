name: Feature
description: New capability or extension to an existing capability
title: "feat: "
body:
  - type: markdown
    attributes:
      value: Complete every field with specific evidence. One Issue has one objective.
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Concise description of the change }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Problem to solve and supporting evidence }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: State to achieve }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: Explicitly excluded work }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Verifiable completion criteria, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: affected
    attributes: { label: Affected areas, description: Affected capabilities, files, and users }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks / compatibility, description: Risks and backward compatibility }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: Dependent Issues, PRs, and external conditions; explain if none }
    validations: { required: true }
  - type: textarea
    id: implementation
    attributes: { label: Implementation notes, description: Constraints, proposed approach, and completed investigation }
    validations: { required: true }

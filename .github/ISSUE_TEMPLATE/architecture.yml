name: Architecture
description: Change to boundaries, contracts, or architectural decisions
title: "refactor: "
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Concise architectural change description }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Current design problem and evidence }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: Target architecture and invariants to preserve }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: Boundaries not changed in this work }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Verifiable design completion criteria, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: affected
    attributes: { label: Affected areas, description: Affected layers and public contracts }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks / compatibility, description: Migration, backward compatibility, and failure impact }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: Prerequisites and follow-up Issues; explain if none }
    validations: { required: true }
  - type: textarea
    id: implementation
    attributes: { label: Implementation notes, description: Alternatives, decision rationale, and phased rollout }
    validations: { required: true }

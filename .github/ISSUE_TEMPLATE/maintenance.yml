name: Maintenance
description: Maintenance, dependency updates, or development infrastructure
title: "chore: "
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Concise maintenance work description }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Need, deadline, and current debt }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: State after completion }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: Changes deliberately excluded from this work }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Verifiable completion criteria, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: affected
    attributes: { label: Affected areas, description: Affected areas }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks / compatibility, description: Operational and compatibility risks }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: Dependent work and external conditions; explain if none }
    validations: { required: true }
  - type: textarea
    id: implementation
    attributes: { label: Implementation notes, description: Execution plan and rollback }
    validations: { required: true }

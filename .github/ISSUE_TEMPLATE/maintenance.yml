name: Maintenance
description: 保守・依存更新・開発基盤
title: "chore: "
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: 保守作業の要約 }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: 必要性・期限・現状の負債 }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: 完了後の状態 }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: 同時に行わない変更 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: 検証可能な完了条件, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: affected
    attributes: { label: Affected areas, description: 影響範囲 }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks / compatibility, description: 運用・互換性リスク }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: 依存作業・外部条件。なければ理由 }
    validations: { required: true }
  - type: textarea
    id: implementation
    attributes: { label: Implementation notes, description: 実施手順・ロールバック }
    validations: { required: true }

name: Research
description: Pre-implementation research or technical validation
title: "docs: research "
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Research topic }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Unresolved question or decision gap }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal, description: Decisions enabled by the research }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: Research and implementation excluded from this work }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Completion criteria for evidence, comparison, and conclusion, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: affected
    attributes: { label: Affected areas, description: Areas affected by the decision }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes: { label: Risks / compatibility, description: Risks from insufficient research or adoption }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies, description: Required sources, environments, and prerequisite Issues }
    validations: { required: true }
  - type: textarea
    id: implementation
    attributes: { label: Implementation notes, description: Alternatives, measurement method, and deliverables }
    validations: { required: true }
